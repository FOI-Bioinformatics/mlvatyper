[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mlvatyper"
version = "0.4.0"
description = "Locate VNTR amplicons in assemblies with merPCR and summarise repeat lengths"
readme = "README.md"
requires-python = ">=3.13"
license = {text = "GPL-3.0-or-later"}
dependencies = [
    "merpcr @ git+https://github.com/FOI-Bioinformatics/merpcr@v1.0.5",
    "biopython>=1.80",
    "pandas>=2.0",
    "jinja2>=3.0",
    "matplotlib>=3.5",
]

[project.urls]
Repository = "https://github.com/FOI-Bioinformatics/mlvatyper"

[project.optional-dependencies]
dev = ["pytest>=7", "pytest-cov", "ruff", "mypy>=1.8", "pandas-stubs", "types-seaborn"]

[project.scripts]
mlvatyper = "mlvatyper.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
mlvatyper = ["templates/*.j2", "schemes/*/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "UP", "SIM", "C90"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.mypy]
python_version = "3.13"
files = ["src/mlvatyper"]
# the checks that catch real mistakes without asking for annotations everywhere; an unannotated
# function is still checked where its types can be inferred
warn_redundant_casts = true
warn_unused_ignores = true
warn_unreachable = true
no_implicit_optional = true
strict_equality = true

[[tool.mypy.overrides]]
# these have no type information of their own
module = ["merpcr.*", "Bio.*", "matplotlib.*", "mpl_toolkits.*"]
ignore_missing_imports = true
