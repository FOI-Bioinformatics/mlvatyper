# Neisseria meningitidis, the 12 locus MLVA of Liao et al. 2006, anchored on Z2491.
name: nmeningitidis_mlva12_liao_2006
organism: Neisseria meningitidis
citation: Liao JC, Li CC, Chiou CS. Use of a multilocus variable-number tandem repeat analysis method for molecular subtyping and phylogenetic analysis of Neisseria meningitidis isolates. BMC Microbiol 2006;6:44. doi:10.1186/1471-2180-6-44, Table 1 (consensus repeat units, unit lengths and the repeat number in Z2491, MC58 and FAM18), Table 5 (primers and the predicted amplicon size in the same three genomes) and the header of Table 2 (the locus order of the MLVA allelic profile)
url: https://doi.org/10.1186/1471-2180-6-44 (open access; Tables 1, 2 and 5)
reference: Neisseria meningitidis serogroup A strain Z2491, chromosome AL157959.1; ref_size is the amplicon size Table 5 predicts for that genome and ref_repeats is the repeat number Table 1 gives for it
assembly: GCA_000009105.1
retrieved: 2026-11-03
rounding: intermediate
allele_tolerance: 0.25
notes: Twelve loci found by searching the three sequenced genomes available at the time, Z2491 of serogroup A, MC58 of serogroup B and FAM18 of serogroup C, for repeats shared by all three and variable between them. The loci are in the order the header of Table 2 gives for the MLVA allelic profile, NMTR1, 2, 6, 7, 9, 9a, 9b, 9c, 10, 12, 18 and 19, so a profile string reads as the published one. Three of the loci had been described before by Yazdankhah et al. and the paper records their earlier names, NMTR1 as VNTR01, NMTR9 as VNTR06 and VNTR08, and NMTR12 as VNTR02. EVERY VALUE IN THIS SCHEME IS PUBLISHED AND THE TWO SOURCE TABLES CHECK EACH OTHER EXACTLY. Table 1 gives the consensus repeat unit, its length and the repeat number in each of the three genomes; Table 5 gives the primers and the predicted amplicon size in the same three. At all twelve loci the amplicon size minus the unit length times the repeat number is the same flanking length in all three genomes, so the sizes and the repeat numbers confirm one another and nothing here is derived. In silico PCR reproduces all twelve Z2491 sizes, and the same primers run against MC58 reproduce all twelve of that genome's sizes and all eleven of its callable repeat numbers, which checks the panel against a genome it is not anchored on. One primer of each pair is printed in Table 5 with a 5' ABI dye, 6-FAM, VIC, NED or PET; the dye is on the forward primer at some loci and the reverse at others, is an assay property and is not part of the oligonucleotide, so it is not in primers.sts. NMTR12 IS A COMPOUND LOCUS and is reported by length only, as STTR3 is in STm_ECDC. Its array mixes a 13 bp unit with a 12 bp one in varying numbers and the paper counts them together, writing the Z2491 allele as 3 = 2a1b and the MC58 one as 29 = 20a9b. The single unit formula cannot express that, so the locus carries no unit length and no repeat number and its allele has to be assigned by hand; its flanking length of 180 bp is the same in all three genomes, so a total count can still be recovered from a size once the mixture is known. patterns are stored at the nine loci where counting the published motif in Z2491 returns the published repeat number, which leaves the tandem array cross-check active there. They are left out at NMTR1, where the counter returns 27 against the published 25 because the A rich 7 bp unit runs on into similar flanking sequence, and at NMTR6, where it returns 1 against 2 because the second copy of the 21 bp unit is too diverged to match. A single copy of a long unit cannot be recognised as a tandem array at all, so NMTR9a is flagged COUNT_DISAGREES in MC58, where the published allele is one copy of a 30 bp unit; this is a property of counting rather than a disagreement with the paper. The search windows are derived rather than published: each runs from the length of the amplicon with no repeat to twenty repeats beyond the largest of the three sequenced genomes. rounding and allele_tolerance are not from the paper and should be tuned on control strains.
