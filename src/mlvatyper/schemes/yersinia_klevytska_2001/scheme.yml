name: yersinia_klevytska_2001
organism: Yersinia pestis
citation: Klevytska AM, Price LB, Schupp JM, Worsham PL, Wong J, Keim P. Identification and characterization of variable-number tandem repeats in the Yersinia pestis genome. J Clin Microbiol 2001;39:3179-3185. doi:10.1128/JCM.39.9.3179-3185.2001
url: https://doi.org/10.1128/JCM.39.9.3179-3185.2001 (locus, CO92 array, allele count, DI and primer table)
reference: strain CO92, chromosome AL590842.1 with plasmids AL117189.1, AL117211.1 and AL109969.1 - confirmed by downloading the assembly
assembly: GCA_000009065.1
retrieved: 2026-10-24
rounding: intermediate
allele_tolerance: 0.25
notes: This is a 42 locus marker survey, not a standardised panel. The paper screened 77 loci and characterised these 42 as polymorphic; later operational panels (Ramisse/Pourcel MLVA-25, Li MLVA-14+12) draw subsets from it, and M15, M22, M23, M25, M28, M29, M33, M34, M43, M58 and M61 recur in the Li 2013 hierarchical scheme. All 84 primer sequences, 42 unit lengths and 42 copy numbers were compared with the publication's table and match it. unit_length and ref_repeats come from the CO92 array column, in which '1 by 11' means a 1 bp unit at 11 copies. ref_size is the product length measured in CO92 by in silico PCR with these primers; all 42 pairs give exactly one product there, only M29 with a primer mismatch, and the publication gives no product sizes to compare it with. Repeat detection in the CO92 amplicons confirms 40 of the 42 published unit lengths independently; M33 holds 9 copies of a 9 bp unit rather than the published 22 and its strongest signal is a higher order 18 bp period, and M36 is published as a single copy so there is no array in the reference at all. The number of whole units in the amplicon differs from the published copy number for 17 markers in both directions, so the column was not misread; the published values are most likely counted on the draft sequence available in 2001 or by different criteria. They are kept, because they define the published allele numbering and there is no better source, and ref_size is measured here so that the pair is consistent for CO92. A consequence is that an allele number from this scheme is not a literal count of whole units in AL590842.1. patterns are N/A because the publication gives no consensus repeat sequences, so the tandem array cross-check is skipped and alleles rest on amplicon length alone. ref_repeats is fractional for M23 (6.5), M58 (7.5) and M65 (2.5), as published; the alleles of those markers lie on a half-integer grid, which mlvatyper numbers as such instead of treating n.5 as an intermediate value, and rounding is intermediate for the same reason. Fluorescent label prefixes were stripped from the primer sequences to leave the oligo itself: M02 R/Hex, M06 F/Fam, M09 F/Fam, M12 R/Ned, M18 R/Hex, M2 F/Ned, M22 F/Fam, M23 F/Hex, M25 F/Hex, M27 F/Fam, M28 R/Ned, M29 F/Ned, M31 F/Fam, M33 F/Hex, M34 F/Fam, M58 F/Hex, M59 F/Ned, M79 F/Fam; the remaining 24 markers are published unlabelled. M02 and M2 are listed in the table as two different loci, 1 by 11 with DI 0.76 and 7 by 5 with DI 0.49, and both amplify one product of their own in CO92, so they are kept as distinct ids; the bare M2 is anomalous where single digits are otherwise zero-padded, and M21 is cited by later schemes but absent from this table, so confirm the id against the paper before using it as a database key. The trailing c on the published M12c is a footnote mark, as the b on the DI column heading is, and the id is M12. primers.sts expected size is a deliberately generous 60-1500 window for every marker rather than a reference product; it only bounds the search and could be tightened now that the reference sizes are known. Fourteen loci have fewer than 3 copies in CO92 (M15, M26, M36, M41, M55, M56, M65, M66, M69, M71, M72, M73, M74, M76) and de novo array detection will not find them at default settings; pass --min-copies 2 and --min-unit 1 to reach them, the latter for M02, whose unit is a single base. M69 is reported with 2 alleles but DI 0.00, and M41, M71 and M77 with DI 0.15, so these are effectively uninformative and are candidates for exclusion; the most informative are M79 (0.86), M23, M25, M27 and M29 (0.83 to 0.84) and M12, M18 and M22 (0.82). DI and allele counts are from the paper's panel of 24 isolates and are properties of that sample, not of the panel. allele_tolerance is not from the paper and should be tuned on control strains.
