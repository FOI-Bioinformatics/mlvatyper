# Brucella MLVA-15 of Le Fleche et al. 2006: scheme metadata, one key: value per line.
name: brucella_mlva15_lefleche_2006
organism: Brucella
citation: Le Fleche P, Jacques I, Grayon M, Al Dahouk S, Bouchon P, Denoeud F, Nockler K, Neubauer H, Guilloteau LA, Vergnaud G. Evaluation and selection of tandem repeat loci for a Brucella MLVA typing assay. BMC Microbiol 2006;6:9. doi:10.1186/1471-2180-6-9
url: https://doi.org/10.1186/1471-2180-6-9 (panel, locus, primer and amplicon size table)
reference: strain 16M (Brucella melitensis bv. 1), chromosome I AE008917.1 and chromosome II AE008918.1 - confirmed by downloading the assembly
assembly: GCA_000007125.1
retrieved: 2026-10-24
rounding: intermediate
allele_tolerance: 0.25
notes: MLVA-15 is panel 1 (Bruce06, 08, 11, 12, 42, 43, 45, 55) followed by panel 2 (Bruce04, 07, 09, 16, 18, 21, 30), and primers.sts keeps that order so profile strings come out in the published order. Panel 1 is the conserved panel used for species assignment and broad clustering, panel 2 the discriminatory one; the later MLVA-16 adds Bruce19 to panel 2 and is therefore not interchangeable with this scheme. Locus ids are the publication's Bruce names and the label column carries the MLVAbank identifier, which encodes the three reference numbers as NAME_<unit>bp_<size>bp_<n>u; unit_length, ref_size and ref_repeats are read from it and every one of the 15 sizes agrees with the table's B. melitensis column, which is what fixes 16M as the reference strain. Bruce04, Bruce09 and Bruce30 are also published as TR6, TR8 and TR2. check-scheme against 16M reproduces all 15 markers with exactly one product of the reference size, no primer mismatches and no need for the rescue pass, and each product lies on the chromosome the table states, chromosome II for Bruce12, Bruce16, Bruce18 and Bruce21 and chromosome I for the rest. A run on the assembly returns the published copy number for every locus with a residual of zero, profile 3-4-2-13-4-2-3-3-2-5-7-3-5-6-6. patterns are N/A because the table gives no consensus repeat sequences, so the tandem array cross-check is skipped and alleles rest on amplicon length alone, which is how this scheme is numbered in MLVAbank. Repeat detection in the 16M amplicons confirms the published unit length for 8 of the 15 loci and finds no array for Bruce06, Bruce08, Bruce11 and Bruce55 at any setting tried; where it does find one it counts fewer whole copies than published, because these arrays are imperfect and only the longest exact run is reported, so no units were filled from the reference. Bruce06 and Bruce42 have 134 bp and 125 bp units and their stated reference sizes leave only 6 bp and 39 bp outside the array, less than their two primers occupy, so for these two loci the primers lie inside the repeat array and the copy number counts units that include the priming sites; the allele formula is unaffected because it only needs the size and copy number to be consistent, which they are. primers.sts expected size is the published range of amplicon sizes across the paper's reference panel rather than the reference product, so that every known allele falls inside the search window; it only bounds the search and does not affect allele calls, and it can be widened if an isolate falls outside the published range. The table also gives sizes for B. suis 1330 and B. abortus 9-941, which are not used here; only the 16M column anchors the calls. The allele counts and HGDI values in the table describe the paper's reference panel and are properties of that sample, not of the panel. rounding and allele_tolerance are not from the paper and should be tuned on control strains. bins.tsv is the size to allele table of Bru_MLVA16 without Bruce19 (Al Dahouk et al. 2007 Table 2 with the MLVAbank version 3.6 additions); see that scheme for its sources. rescue_indels is on for the same reason as in Bru_MLVA16.
rescue_indels: yes
