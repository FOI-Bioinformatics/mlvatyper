# Bacillus anthracis MLVA-31 as bundled by MLVAbank: scheme metadata, one key: value per line.
name: bacillus_mlva31_mlvabank
organism: Bacillus anthracis
citation: Keim P, Price LB, Klevytska AM, Smith KL, Schupp JM, Okinaka R, Jackson PJ, Hugh-Jones ME. Multiple-locus variable-number tandem repeat analysis reveals genetic relationships within Bacillus anthracis. J Bacteriol 2000;182:2928-2936. doi:10.1128/JB.182.10.2928-2936.2000; Lista F, Faggioni G, Valjevac S, Ciammaruconi A, Vaissaire J, le Doujet C, et al. Genotyping of Bacillus anthracis strains based on automated capillary 25-loci multiple locus variable-number tandem repeats analysis. BMC Microbiol 2006;6:33. doi:10.1186/1471-2180-6-33; Van Ert MN, Easterday WR, Huynh LY, Okinaka RT, Hugh-Jones ME, Ravel J, et al. Global genetic population structure of Bacillus anthracis. PLoS One 2007;2:e461. doi:10.1371/journal.pone.0000461
url: https://microbesgenotyping.i2bc.paris-saclay.fr (MLVAbank, from which the locus identifiers and the panel composition are taken; the primer table used here was supplied directly)
reference: strain Ames Ancestor, chromosome AE017334.2 with plasmids pXO1 AE017336.2 and pXO2 AE017335.3 - the reference values encoded in the MLVAbank identifiers are reproduced in this assembly
assembly: GCA_000008445.1
retrieved: 2026-10-24
rounding: intermediate
allele_tolerance: 0.25
notes: MLVA-31 is the composite Bacillus anthracis panel bundled by MLVAbank: the eight MLVA-8 loci of Keim et al. 2000, seventeen bams loci of Lista et al. 2006 and six vntr loci of Van Ert et al. 2007, in that order, which is the order of the source table and therefore of the profile strings. The locus ids are the short names and the label column keeps the full MLVAbank identifier, which encodes unit length, reference size and reference copy number as NAME_<unit>bp_<size>bp_<n>u; all three columns are read from it, so unlike bacillus_mlva8_keim_2000 and bacillus_mlva15_vanert_2007 this scheme contains no derived number. The source table holds 32 loci, one more than the panel name, and bams07 is the only one carrying an extra footnote mark; holding it out leaves exactly 31 loci and leaves the bams set equal to the seventeen of Lista et al., so bams07 is held out here. It is not a defective locus: it gives one product of its published 1017 bp in the reference, and the commented lines in primers.sts and markers.tsv restore it in two edits. Aliases the table gives: bams01 is also vntr32, bams07 is bclE, bams13 is bclA, bams15 is bclD, bams30 is bclB and bams31 is bclC. Replicons: pXO1-aat is on pXO1, pXO2-at, vntr16 and vntr17 are on pXO2, and the remaining 27 loci are chromosomal, so an isolate that has lost a plasmid gives no product for the loci on it, reported as NOT_DETECTED rather than as an allele. The reference carries both plasmids. check-scheme against Ames Ancestor reproduces all 31 loci with exactly one product of the published reference size, at word size 11 and without the rescue pass, which is a complete check of the published sizes. Six of the vntr reverse primers carry a 5' G that is not in the genome, so five report one primer mismatch and vntr19 happens to match; the primers are kept as published and the published sizes already include that base. A run on the reference returns the published copy number at every locus with a residual of zero, profile 4-20-13-53-17-2-7-9-16-26-5-70-24-10-16-11-11-13-14-57-64-11-8-9-8-6-20-4-4-4-5. patterns are filled for the eight loci where the motif published by Van Ert et al. 2007 occurs in the reference exactly the published number of times, so the tandem array cross-check is active on those; the source table gives no motifs, so the other 23 are N/A and their alleles rest on amplicon length alone, which is how this panel is numbered. Two loci are left without a pattern although their motif is known, because counting it disagrees with the published number: the pXO2-at array holds ten TA units where the panel numbers the reference 9, and the vntr16 array holds 20 published units of ACATTTAC of which only four are perfect copies. An allele here is therefore not always a literal count of whole units in the reference. This panel also numbers vrrC1 on a 9 bp unit and vrrC2 on an 18 bp unit rather than the 36 bp higher-order period those arrays also show, and the 21 bp unit it gives for bams01 confirms the unit derived for the same locus, under the name BaVNTR32, in bacillus_mlva15_vanert_2007. vrrB1 and vrrB2 have 20 and 13 units of 9 bp in a 229 and a 153 bp product, leaving 49 and 36 bp outside the array, less than their two primers occupy, so for these two loci the primers lie inside the repeat array; the allele formula is unaffected because it needs only the size and the copy number to be consistent, which they are. primers.sts expected size is a window from the reference size less 250 bp, floored at 60, to the reference size plus 450 bp; it only bounds the search, does not affect allele calls, and can be tightened per locus from published allele ranges. rounding and allele_tolerance are not from the source and should be tuned on control strains.
