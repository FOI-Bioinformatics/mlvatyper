# Mycoplasma agalactiae, the four locus MLVA of McAuliffe et al. 2008, anchored on type strain PG2.
name: magalactiae_mlva4_mcauliffe_2008
organism: Mycoplasma agalactiae
citation: McAuliffe L, Churchward CP, Lawes JR, Loria G, Ayling RD, Nicholas RAJ. VNTR analysis reveals unexpected genetic diversity within Mycoplasma agalactiae, the main causative agent of contagious agalactia. BMC Microbiol 2008;8:193. doi:10.1186/1471-2180-8-193, Table 1 (VNTR genomic positions, repeat unit lengths, PG2 copy numbers and primers)
url: https://doi.org/10.1186/1471-2180-8-193 (Table 1)
reference: Mycoplasma agalactiae PG2, chromosome CU179680.1; ref_size is the product these primers give in that assembly and ref_repeats is the PG2 copy number of Table 1
assembly: GCA_000063605.1
retrieved: 2026-11-03
rounding: intermediate
allele_tolerance: 0.25
explained_flags: Magal_VNTR17, Magal_VNTR5, Magal_VNTR19
notes: Four VNTRs selected from seven that varied among ten strains of wide geographical origin, drawn from 30 tandem repeats in the sequenced PG2 genome, and amplified for 88 strains. The loci keep the paper's names, Magal_VNTR5, 14, 17 and 19. Every reference value is published: Table 1 gives the repeat unit length and the PG2 copy number for each. Three copy numbers are fractional, 2.3, 3.6 and 2.3, because the arrays are imperfect, 72 to 83 per cent identical by the paper's count, so the reference alleles lie on a grid offset from the integers; Magal_VNTR14 is a clean 2.0. The paper recorded profiles as arbitrary allele codes rather than these copy numbers, so an allele here is the repeat number and may not equal a published allele code. The primers give one product per locus in PG2; three equal the total length Table 1 reports, and Magal_VNTR19 does not, its measured 184 bp standing against a reported 153 bp and a genomic span of 226 bp that disagree with each other in the source, so the measured product is used because ref_size must describe the assembly. The Magal_VNTR5 reverse primer mismatches the PG2 genome, so that locus is found by the aligned rescue pass and gives the published 226 bp product there. No repeat unit sequences are stored, because the arrays are too imperfect to cross-check. rounding and allele_tolerance are not from the paper and should be tuned on control strains.
