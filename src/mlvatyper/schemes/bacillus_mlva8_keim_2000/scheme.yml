name: bacillus_mlva8_keim_2000
organism: Bacillus anthracis
citation: Keim P, Price LB, Klevytska AM, Smith KL, Schupp JM, Okinaka R, Jackson PJ, Hugh-Jones ME. Multiple-locus variable-number tandem repeat analysis reveals genetic relationships within Bacillus anthracis. J Bacteriol 2000;182:2928-2936. doi:10.1128/JB.182.10.2928-2936.2000
url: https://doi.org/10.1128/JB.182.10.2928-2936.2000 (marker, primer, dye label and melting temperature table)
reference: strain Ames Ancestor, chromosome AE017334.2 with plasmids pXO1 AE017336.2 and pXO2 AE017335.3
assembly: GCA_000008445.1
retrieved: 2026-10-24
rounding: intermediate
allele_tolerance: 0.25
notes: MLVA-8 is the eight locus scheme of Keim et al. 2000 for Bacillus anthracis: the six chromosomal loci vrrA, vrrB1, vrrB2, vrrC1, vrrC2 and CG3 and the two plasmid loci pXO1-aat and pXO2-at. primers.sts keeps that order, which is the order of the published profile, so profile strings come out in it. An isolate that has lost a plasmid gives no product for the corresponding locus, which is reported as NOT_DETECTED rather than as an allele; the reference carries both plasmids. Locus ids are the publication's marker names and the label column repeats them, because this scheme has no MLVAbank style identifier that encodes reference values. The source table gives the primers with a fluorescent label prefix in the primer name; the prefix is not part of the oligonucleotide and is not in primers.sts. Dye, on the forward or reverse primer as printed: vrrA forward FAM, vrrB1 forward FAM, vrrB2 forward FAM, vrrC1 reverse FAM, vrrC2 forward HEX, CG3 forward NED, pXO1-aat forward FAM, pXO2-at forward HEX. The table's melting temperatures, 64 to 72 C, are properties of the assay and are not used here. The pXO1-aat primers are the f3 and r3 pair, not the first design. ref_size is the product length measured in Ames Ancestor by in silico PCR with these primers: every locus gives exactly one product, all are searchable at word size 11, none needs the rescue pass and none has a primer mismatch, and each product lies on the replicon its name implies, the six chromosomal loci on AE017334.2, pXO1-aat on pXO1 AE017336.2 and pXO2-at on pXO2 AE017335.3. The source table gives no amplicon sizes, so there is nothing to compare the measured sizes with. THE COPY NUMBERS ARE NOT PUBLISHED VALUES. The table carries primers, dye labels and melting temperatures only, so unit_length and ref_repeats are both derived from the reference assembly and are recorded with the method per locus in markers.tsv: the unit is the shortest period whose units tile the array, and the copy number is either the count the tandem array counter returns for the stored pattern at the default mismatch allowance (vrrA, vrrB1, vrrB2, CG3, pXO1-aat, pXO2-at) or, for the two long imperfect arrays vrrC1 and vrrC2, the number of consecutive 36 bp units before the identity to the preceding unit drops sharply. MLVA-8 alleles are canonically assigned from fragment size against the published allele table, which was not supplied, so a derived copy number may be offset from the canonical allele by a constant and a profile from this scheme must not be compared with published MLVA-8 genotypes until the values are confirmed against that table; supplying it as bins.tsv is the better fix. The 3 bp unit AAT of pXO1-aat and the 2 bp unit AT of pXO2-at agree with the locus names, which is the only independent check the source table itself allows. The units and the reference sizes are corroborated from outside it: Van Ert et al. 2007 (PLoS One 2;e461), the MLVA-15 paper that carries these eight loci forward with the same primers, publishes a repeat motif and a genomic location for each, and every published span equals the measured ref_size while every motif agrees with the unit derived here, the CG3 motif TAATA being the published rotation of the same 5 bp unit and now the stored form. The copy numbers stay derived, because that paper gives no allele definitions either. The bundled scheme bacillus_mlva15_vanert_2007 holds that panel, with these eight loci as an exact subset in primers and reference values but in a different order, so the two profile strings are not aligned. patterns are filled for the six loci whose array the counter reproduces, so the tandem array cross-check is active on those and skipped on vrrC1 and vrrC2, whose units differ from their neighbours by up to 7 of 36 bases; counting those needs a mismatch allowance that would also merge unrelated windows, so unit_mismatches is left at its default. The two locus pairs are adjacent paralogues and their amplicons overlap in the reference, vrrB1 with vrrB2 by 27 bp and vrrC1 with vrrC2 by 36 bp, one repeat unit; the loci are still independent because each pair's arrays are distinct, but a rearrangement in that region can affect both members of a pair at once. The vrrB1 and vrrB2 arrays are degenerate 9 bp CA-rich repeats running most of the amplicon, so their stated counts are the clean core rather than the full array and these two loci carry the largest risk of an offset. A run on the reference returns 4-3-2-7-8-2-7-10 with a residual of zero at every locus. rounding and allele_tolerance are not from the paper and should be tuned on control strains.
