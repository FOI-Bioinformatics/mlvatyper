name: bacillus_mlva8_keim_2000
organism: Bacillus anthracis
citation: Keim P, Price LB, Klevytska AM, Smith KL, Schupp JM, Okinaka R, Jackson PJ, Hugh-Jones ME. Multiple-locus variable-number tandem repeat analysis reveals genetic relationships within Bacillus anthracis. J Bacteriol 2000;182:2928-2936. doi:10.1128/JB.182.10.2928-2936.2000
url: https://doi.org/10.1128/JB.182.10.2928-2936.2000 (marker, primer, dye label and melting temperature table)
reference: strain Ames Ancestor, chromosome AE017334.2 with plasmids pXO1 AE017336.2 and pXO2 AE017335.3
assembly: GCA_000008445.1
retrieved: 2026-10-24
rounding: intermediate
allele_tolerance: 0.25
notes: MLVA-8 is the eight locus scheme of Keim et al. 2000 for Bacillus anthracis: the six chromosomal loci vrrA, vrrB1, vrrB2, vrrC1, vrrC2 and CG3 and the two plasmid loci pXO1-aat and pXO2-at. primers.sts keeps that order, which is the order of the published profile, so profile strings come out in it. An isolate that has lost a plasmid gives no product for the corresponding locus, which is reported as NOT_DETECTED rather than as an allele; the reference carries both plasmids. Locus ids are the publication's marker names and the label column carries the MLVAbank identifier, which encodes the three reference numbers as NAME_<unit>bp_<size>bp_<n>u. unit_length, ref_size and ref_repeats are read from it, so all three are published values; they are the same numbers as in the bundled scheme bacillus_mlva31_mlvabank, whose source table supplied them. The primer table of Keim et al. 2000 itself carries no amplicon sizes, unit lengths or allele definitions. The source table gives the primers with a fluorescent label prefix in the primer name; the prefix is not part of the oligonucleotide and is not in primers.sts. Dye, on the forward or reverse primer as printed: vrrA forward FAM, vrrB1 forward FAM, vrrB2 forward FAM, vrrC1 reverse FAM, vrrC2 forward HEX, CG3 forward NED, pXO1-aat forward FAM, pXO2-at forward HEX. The MLVA-15 panel of Van Ert et al. 2007 assigns some of these loci different dyes, which bacillus_mlva15_vanert_2007 records. The table's melting temperatures, 64 to 72 C, are properties of the assay and are not used here. The pXO1-aat primers are the f3 and r3 pair, not the first design. check-scheme against Ames Ancestor reproduces all eight loci with exactly one product of the published reference size, at word size 11, without the rescue pass and with no primer mismatch, each on the replicon its name implies: the six chromosomal loci on AE017334.2, pXO1-aat on pXO1 AE017336.2 and pXO2-at on pXO2 AE017335.3. The genomic locations published by Van Ert et al. 2007 span exactly these eight sizes as well. A run on the reference returns the published copy number at every locus with a residual of zero, profile 4-20-13-53-17-2-7-9. The first version of this scheme derived the unit lengths and copy numbers from the reference, for want of published ones, and warned that a derived count could be offset from the canonical allele; the published values show how far that went. The derived count was right at vrrA, CG3 and pXO1-aat and wrong at the other five: pXO2-at by one, ten TA units counted where the panel numbers the reference 9; vrrB1 and vrrB2 badly, 3 and 2 counted against 20 and 13, because their 9 bp arrays are degenerate and only the clean core was counted; and vrrC1 and vrrC2 on the wrong unit, 7 and 8 units of the 36 bp higher-order period that those arrays also show, where the panel numbers them 53 units of 9 bp and 17 units of 18 bp. An allele in this panel is therefore not always a literal count of whole units in the reference. patterns are kept only for the three loci whose published copy number equals the number of times the published motif occurs in the reference, so the tandem array cross-check is active on those and skipped on the rest, where it would contradict the published number; unit_mismatches is left at its default. The motifs are the ones published by Van Ert et al. 2007, with CG3 in the published rotation TAATA; that paper describes vrrB1 as a 9 bp degenerate repeat and vrrB2, vrrC1 and vrrC2 as Complex, which is what the reference shows. vrrB1 and vrrB2 hold 20 and 13 units of 9 bp in a 229 and a 153 bp product, leaving 49 and 36 bp outside the array, less than their two primers occupy, so for these two loci the primers lie inside the repeat array; the allele formula is unaffected because it needs only the size and the copy number to be consistent, which they are. The two locus pairs are adjacent paralogues and their amplicons overlap in the reference, vrrB1 with vrrB2 by 27 bp and vrrC1 with vrrC2 by 36 bp, so a rearrangement in either region can move both members of a pair. vrrA has a fifth, divergent 12 bp copy immediately upstream of the four the panel counts, which the published copy number does not include. The bundled scheme bacillus_mlva15_vanert_2007 holds the MLVA-15 panel, with these eight loci as an exact subset in primers and reference values but in a different order, so the two profile strings are not aligned, and bacillus_mlva31_mlvabank holds the 31 locus composite panel, which contains all eight as well. rounding and allele_tolerance are not from the paper and should be tuned on control strains.
