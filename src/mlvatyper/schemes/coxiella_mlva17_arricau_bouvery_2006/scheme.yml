# Coxiella burnetii MLVA of Arricau-Bouvery et al. 2006: scheme metadata, one key: value per line.
name: coxiella_mlva17_arricau_bouvery_2006
organism: Coxiella burnetii
citation: Arricau-Bouvery N, Hauck Y, Bejaoui A, Frangoulidis D, Bodier CC, Souriau A, Meyer H, Neubauer H, Rodolakis A, Vergnaud G. Molecular characterization of Coxiella burnetii isolates by infrequent restriction site-PCR and MLVA typing. BMC Microbiol 2006;6:38. doi:10.1186/1471-2180-6-38
url: https://doi.org/10.1186/1471-2180-6-38 (panel, locus, primer, size range and unit number table; the locus identifiers follow the MLVAbank convention, https://microbesgenotyping.i2bc.paris-saclay.fr)
reference: strain Nine Mile RSA 493, chromosome AE016828.3 with plasmid pQpH1 AE016829.2 - confirmed by downloading the assembly; all seventeen loci are chromosomal
assembly: GCA_000007765.2
retrieved: 2026-10-25
rounding: intermediate
allele_tolerance: 0.25
notes: The panel is panel 1, ten minisatellites with a repeat unit above 9 bp, followed by panel 2, seven microsatellites with a 6 or 7 bp unit, and primers.sts keeps that order so profile strings come out in the published order. Panel 2 is the more variable of the two and panel 1 the slower marker set, so the panels are often reported separately; they are bundled together here because the publication presents them as one assay, and a profile string can be split at ms36 to recover the two panel codes. The locus ids are the short ms names and the label column carries the full identifier, which is written NAME_<unit>bp_<n>U_<size>bp and gives the gene of the Nine Mile RSA 493 annotation, the repeat unit length, the copy number in that strain and the amplicon size. Note that this is not the order of the identifiers used by the Bacillus and Brucella schemes bundled here, so the parser of MLVAbank ids does not read it; unit_length, ref_repeats and the published size were transcribed into markers.tsv by hand and checked against the identifier. Aliases the source gives, from the Cox nomenclature: ms26 is Cox3, ms23 is Cox6, ms24 is Cox4, ms27 is Cox2, ms28 is Cox5, ms31 is Cox7 and ms34 is Cox1; for these loci the source also lists an alternative set of unit numbers, recorded in markers.tsv. check-scheme against Nine Mile RSA 493 gives exactly one product per locus at word size 11, without the rescue pass and without a primer mismatch. Fourteen of the seventeen products have exactly the published size. The three that do not are ms30, ms31 and ms36, where the measured product is 91, 103 and 30 bp longer than the identifier states; markers.tsv records the measurements, the evidence that the locus is nevertheless the right one and the consequence, which is that alleles at ms30 and ms31 cannot be put on the grid the published sizes imply and should not be compared with published allele numbers until the two primer pairs are confirmed against the publication. ms20 and ms36 are not independent loci. Both lie in Cbu1941 and share a forward primer two bases apart, so the ms36 product contains the whole ms20 product: ms20 spans 1941232 to 1941633 of AE016828.3 and ms36 spans 1941234 to 1941710, and the 18 bp array that ms20 is numbered on lies inside the ms36 amplicon while the 9 bp array that ms36 is numbered on lies in the 77 bp that ms36 adds at the 3' end. A length change in the ms20 array therefore also changes the ms36 product and will be read as an ms36 allele change, so the two loci must not be treated as independent characters in a distance calculation. ms07 and ms12 are the paralogous pair of 126 bp minisatellites in Cbu0988 and Cbu1316; their primers are similar but each pair gives a single product in the reference. patterns is filled only for ms31, the one locus whose detected repeat unit occurs in the reference amplicon exactly the published number of times, so the tandem array cross-check is active there and skipped elsewhere; the source table carries no repeat motifs and at the other sixteen loci the published copy number is not a count of whole units in the reference, which markers.tsv sets out per locus. Alleles in this panel therefore rest on amplicon length, which is how the panel is numbered. A run on the reference returns the published copy number at every locus with a residual of zero, profile 4-7-8-8-15-6-6-4-6-4-8-27-4-6-5-9-5. primers.sts expected size is a search window built from the published estimated size range extended to the measured reference size, less 50 bp and plus 200 bp; it only bounds the search and does not affect allele calls. The source also carries two columns headed per cent matches and per cent G+C content whose meaning is not clear from the table supplied, so they are not recorded. rounding and allele_tolerance are not from the publication and should be tuned on control strains.
