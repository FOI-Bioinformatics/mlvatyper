# Staphylococcus aureus, the eight locus MLVA of Schouls et al. 2009, run as two multiplex PCRs.
name: saureus_mlva8_schouls_2009
organism: Staphylococcus aureus
citation: Schouls LM, Spalburg EC, van Luit M, Huijsdens XW, Pluister GN, van Santen-Verheuvel MG, van der Heide HGJ, Grundmann H, Heck MEOC, de Neeling AJ. Multiple-locus variable number tandem repeat analysis of Staphylococcus aureus: comparison with pulsed-field gel electrophoresis and spa-typing. PLoS ONE 2009;4:e5082. doi:10.1371/journal.pone.0005082, Table 1 (average repeat size, number of variable bases and the repeat range over 1681 isolates) and Table 2 (primers and their coordinates in the N315 chromosome)
url: https://doi.org/10.1371/journal.pone.0005082 (open access; Tables 1 and 2)
reference: Staphylococcus aureus subsp. aureus N315, chromosome BA000018.3, which is the sequence NC_002745 that the Table 2 coordinates refer to; ref_size is the product these primers give in that assembly and equals the span of the published coordinates at every locus
assembly: GCA_000009645.1
retrieved: 2026-11-03
rounding: intermediate
allele_tolerance: 0.25
notes: Eight loci selected from the genome sequences of nine S. aureus strains and amplified in two multiplex reactions of four, each forward primer carrying one of four dyes so that the products can be read in one channel against a fifth labelled size standard. Three loci lie in coding sequence, sspA, spa and coa, and five are non-coding; VNTR24_01 is the spa repeat region that spa sequence typing reads, so this panel and spa typing are not independent at that locus. The loci are kept in the order of Table 1, which is the order Figure 1 marks round the chromosome, so a profile string is in the published order. ALL EIGHT LOCI ARE CALLED ON THE PUBLISHED SCALE. Figure 7 of Schouls et al. 2009 gives the MLVA profile of 14 sequenced strains, and the profile of N315, the assembly this scheme is anchored on, is 14-2-1-3-2-11-7-5 in this locus order; those eight numbers are the reference counts, so a run on N315 returns that profile with a residual of zero. An earlier version of this scheme could not call, then called four loci by borrowing counts from the Pourcel panel on that panel's scale; Figure 7 is the scheme's own convention and supersedes both, correcting the four borrowed values. The anchor is validated against the other sequenced strains of Figure 7 that have an assembly, Mu50, MW2, MRSA252, MSSA476, COL, NCTC8325 and USA300: with the flank fixed from N315, seven of the eight loci reproduce each published profile exactly, including the MRSA252 null allele that the paper writes as 99 and this tool reports as no product. The eighth, VNTR61_01, is the locus the paper singles out as having a heterogeneous upstream flank, for which the authors shifted bins by hand; here it calls N315 and strains with the same flank correctly but gives a shifted or fractional allele in others, flagged rather than forced, so a VNTR61_01 allele should be read with care. THE UNIT LENGTHS WERE CHECKED AGAINST EIGHT GENOMES, where a flank does not change between strains so products differ by whole multiples of the unit: six units pass as published, VNTR63_01 is corrected from the table's rounded 64 to the 63 bp step the data shows, and VNTR61_02 and VNTR67_01 drift by a fraction of a unit in some lineages but round to the published value. No repeat unit sequences are published, so patterns is empty throughout and alleles are computed from amplicon length. check-scheme against N315 reproduces all eight products at word size 11 with no primer mismatch, each equal to the span of the Table 2 coordinates for the same primer pair. The search windows are derived, each the measured product widened both ways by the full Table 1 repeat range, and every size seen across the eight genomes falls inside its window. Two loci overlap the other bundled S. aureus schemes: VNTR24_01 is the spa repeat, which saureus_mlva5_sabat_2003 also reads and the Pourcel panel saureus_mlva14_pourcel_2009 calls Sa0122, and VNTR63_01 is Sa1132 there; the three schemes use different primers and number their arrays on their own scales, so their profiles are not interchangeable. rounding and allele_tolerance are not from the paper and should be tuned on control strains.
