# Staphylococcus aureus, the eight locus MLVA of Schouls et al. 2009, run as two multiplex PCRs.
name: saureus_mlva8_schouls_2009
organism: Staphylococcus aureus
citation: Schouls LM, Spalburg EC, van Luit M, Huijsdens XW, Pluister GN, van Santen-Verheuvel MG, van der Heide HGJ, Grundmann H, Heck MEOC, de Neeling AJ. Multiple-locus variable number tandem repeat analysis of Staphylococcus aureus: comparison with pulsed-field gel electrophoresis and spa-typing. PLoS ONE 2009;4:e5082. doi:10.1371/journal.pone.0005082, Table 1 (average repeat size, number of variable bases and the repeat range over 1681 isolates) and Table 2 (primers and their coordinates in the N315 chromosome)
url: https://doi.org/10.1371/journal.pone.0005082 (open access; Tables 1 and 2)
reference: Staphylococcus aureus subsp. aureus N315, chromosome BA000018.3, which is the sequence NC_002745 that the Table 2 coordinates refer to; ref_size is the product these primers give in that assembly and equals the span of the published coordinates at every locus
assembly: GCA_000009645.1
retrieved: 2026-11-03
rounding: intermediate
allele_tolerance: 0.25
notes: Eight loci selected from the genome sequences of nine S. aureus strains and amplified in two multiplex reactions of four, each forward primer carrying one of four dyes so that the products can be read in one channel against a fifth labelled size standard. Three loci lie in coding sequence, sspA, spa and coa, and five are non-coding; VNTR24_01 is the spa repeat region that spa sequence typing reads, so this panel and spa typing are not independent at that locus. The loci are kept in the order of Table 1, which is the order Figure 1 marks round the chromosome, so a profile string is in the published order. THIS SCHEME SIZES ITS MARKERS BUT DOES NOT CALL THEM, and every marker is reported by amplicon length with no allele. The paper computes an allele as the product length minus the flanking length divided by the repeat size, but it publishes neither the flanking lengths nor the repeat unit sequences, and it does not state the repeat number of the sequenced reference, so the one quantity needed to anchor the calculation is absent. Two attempts to recover it both fall short and are recorded in markers.tsv: amplifying the panel in eight S. aureus genomes fixes each flanking length only up to a whole number of repeats, because every candidate that differs by one unit explains all eight strains equally well, and locating the arrays in N315 directly is defeated by how imperfect the repeats are, the boundary of the best periodic region being uncertain by a fraction of a unit. A wrong reference count shifts every allele at that locus by a constant and would not show up anywhere in the output, so no count is recorded in place of a doubtful one. Supplying the flanking lengths, which fix ref_repeats against the sizes already measured, or the published size to allele table as bins.tsv, is what would turn this into a calling scheme. THE UNIT LENGTHS WERE CHECKED AGAINST EIGHT GENOMES and one is corrected. Since a flanking length does not change between strains, every product of a locus must leave the same remainder when divided by its repeat unit. VNTR09_01, VNTR24_01 and VNTR81_01 pass at the published unit, and VNTR21_01 passes for seven of the eight, MRSA252 being one base shorter through an indel in the flank rather than a repeat difference. VNTR63_01 fails at the published 64 bp and passes exactly at 63 bp, every observed size differing by a multiple of 63, so markers.tsv records 63 and the 64 the paper prints is the average it describes. Three loci fit no single period at all. VNTR67_01 steps by 67 and by 133, so units of 67 and 66 alternate and the published figure is their average. VNTR61_02 is irregular, and it is the locus Table 1 gives 23 variable bases in a 66 bp unit. VNTR61_01 is irregular in exactly the way the paper reports for it, that its upstream flanking region is heterogeneous and yields slightly larger and smaller fragments, which is why the authors shifted some bins by hand to fit the observed allele sizes; a size from this locus should be read with that in mind. Table 1 bounds what to expect elsewhere: over the 1681 isolates the repeat number ranges 6 to 25 at VNTR09_01, 0 to 6 at VNTR61_01, 0 to 5 at VNTR61_02, 0 to 10 at VNTR67_01, 0 to 13 at VNTR21_01, 1 to 18 at VNTR24_01, 0 to 11 at VNTR63_01 and 1 to 9 at VNTR81_01, and five loci reach zero repeats, so an absent array is an allele here rather than a failed reaction. The paper assigns 99 to a locus that gives no product after repeated attempts; this scheme reports that as NOT_DETECTED instead. check-scheme against N315 reproduces all eight loci with exactly one product, at word size 11, without the rescue pass and with no primer mismatch, and all eight lengths equal the span of the coordinates Table 2 publishes for the same primer pair, which checks the primers and the coordinates against each other. No repeat unit sequences are published, so patterns is empty throughout. The search windows are derived rather than published: each is the measured product widened both ways by the full repeat range Table 1 gives, so it covers every published allele wherever N315 sits within that range, and every size seen across the eight genomes falls inside its window. rounding and allele_tolerance are recorded for a future definition file and have no effect while no marker can be called.
