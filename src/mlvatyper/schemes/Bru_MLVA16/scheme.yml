# Bru_MLVA16: Brucella MLVA-16. Loci and primers from Le Fleche et al. 2006; the 16-locus panel
# organisation (panel 1, panel 2A, panel 2B) is that of Al Dahouk et al. 2007.
name: Bru_MLVA16
organism: Brucella
citation: Le Fleche P, Jacques I, Grayon M, Al Dahouk S, Bouchon P, Denoeud F, Nockler K, Neubauer H, Guilloteau LA, Vergnaud G. Evaluation and selection of tandem repeat loci for a Brucella MLVA typing assay. BMC Microbiol 2006;6:9. doi:10.1186/1471-2180-6-9 (Table 1, primers and B. melitensis 16M sizes); panel organisation from Al Dahouk S et al. J Microbiol Methods 2007;69:137-145. doi:10.1016/j.mimet.2006.12.015
url: https://doi.org/10.1186/1471-2180-6-9 (open access; Table 1)
reference: Brucella melitensis biovar Abortus 16M (GenBank AE008917 and AE008918); ref_size is the predicted product in 16M given in Le Fleche et al. 2006, Table 1, and ref_repeats the copy number encoded in the locus name
assembly: GCF_000007125.1  # RefSeq assembly of B. melitensis 16M (chromosomes NC_003317.1 and NC_003318.1); downloaded by check-scheme
retrieved: 2026-11-02
notes: 16-locus panel (MLVA-16) of Le Fleche et al. 2006, assembled into panels by Al Dahouk et al. 2007. Panel 1 (MLVA-8) is Bruce06, 08, 11, 12, 42, 43, 45, 55; panel 2A is Bruce18, 19, 21; panel 2B is Bruce04, 07, 09, 16, 30. Al Dahouk et al. weight the panels 2, 1 and 0.2 per locus in clustering; mlvatyper does not weight. No repeat unit sequences are shipped, so alleles are called from amplicon length against 16M. bins.tsv combines Table 2 of Al Dahouk et al. 2007 with the Brucella binning file of MLVA_finder (github.com/dpchris/MLVA), which implements MLVAbank allele numbering version 3.6. Bruce19 follows version 3.6 and is numbered in 3 bp units (16M = 36); older publications (Al Dahouk 2007, Kattar 2008, Jiang 2013) use 6 bp units (16M = 18), and their values are half of the values given here. Where the two sources differ, Bruce12 422, 437 and 452 bp keep the ladder values 15, 16 and 17; the version 3.6 file gives 14 for all three. rescue_indels is on because single primer-site substitutions near the 3' end occur in some lineages (B. canis Bruce11, B. ovis Bruce19, some B. abortus Bruce43) and the main search does not report them. Vergnaud et al. 2018 found that assemblies from reads of 250 bp or longer reconstruct all 16 loci, and that with shorter reads Bruce06, Bruce42, Bruce55 and Bruce21 are the loci most often assembled incorrectly; --max-array-length or long reads help. The two public 16M genome sequences differ at Bruce42, and the 16M laboratory strain gives 164 bp at Bruce09 where the genome predicts 156 bp (Al Dahouk et al. 2007). A novel in silico genotype should be confirmed by PCR before it is reported.
rounding: intermediate
allele_tolerance: 0.25
rescue_indels: yes
