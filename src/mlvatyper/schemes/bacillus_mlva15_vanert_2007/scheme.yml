reference: strain Ames Ancestor, chromosome AE017334.2 with plasmids pXO1 AE017336.2 and pXO2 AE017335.3; the table's coordinates are in the A2012 numbering NC_003995 (chromosome), NC_003980 (pXO1) and NC_003981 (pXO2)
