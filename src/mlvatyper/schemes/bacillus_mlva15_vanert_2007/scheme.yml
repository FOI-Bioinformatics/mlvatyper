notes: MLVA-15 extends the MLVA-8 panel of Keim et al. 2000 with seven loci and keeps the eight older loci with the same primers, so bacillus_mlva8_keim_2000 is an exact subset of this scheme in primers and reference values. The two are not interchangeable: an 8 digit and a 15 digit code are different identifiers, and primers.sts here follows the published primer table, which is ordered by multiplex reaction rather than in the Keim order, so the two profile strings do not line up locus for locus. Multiplex reactions, which this scheme does not otherwise record: 7-1 is BaVNTR12, BaVNTR19 and BaVNTR35; 7-2 is BaVNTR16 and BaVNTR23; 7-3 is BaVNTR17 and BaVNTR32; 8-1 is vrrA, vrrB1 and CG3; 8-2 is pXO1-aat, pXO2-at and vrrB2; 8-3 is vrrC1; 8-4 is vrrC2. Eleven loci are chromosomal; pXO1-aat is on pXO1 and BaVNTR16, BaVNTR17 and pXO2-at are on pXO2, so an isolate that has lost a plasmid gives no product for the loci on it, reported as NOT_DETECTED rather than as an allele. The reference carries both plasmids. Dye, on the forward or reverse primer as printed: BaVNTR12 forward NED, BaVNTR19 forward 6-FAM, BaVNTR35 forward PET, BaVNTR16 forward 6-FAM, BaVNTR23 forward PET, BaVNTR17 forward NED, BaVNTR32 forward VIC, vrrA forward VIC, vrrB1 forward VIC, CG3 forward NED, pXO1-aat forward VIC, pXO2-at forward PET, vrrB2 forward 6-FAM, vrrC1 reverse 6-FAM, vrrC2 forward PET. The prefix is not part of the oligonucleotide and is not in primers.sts. The table's primer concentrations, 0.10 to 0.60 uM, are properties of the assay and are not used here. The dye assignment of vrrA, vrrB1, CG3, pXO1-aat and vrrB2 differs from the one in Keim et al. 2000, which bacillus_mlva8_keim_2000 records. The locus ids are the publication's names and the label column carries the MLVAbank identifier, which encodes unit length, reference size and reference copy number as NAME_<unit>bp_<size>bp_<n>u; unit_length, ref_size and ref_repeats are read from it, so all three are published values and none is derived. Those identifiers come from the source table of bacillus_mlva31_mlvabank, the 31 locus composite panel, which is why the label of each locus this panel adds is vntrNN rather than BaVNTRNN. BaVNTR32 is the one locus whose identifier does not describe this amplicon: MLVAbank calls it bams01, alias vntr32, and amplifies it with a different primer pair, 485 bp against 577 bp here, so its unit length and copy number are taken from the identifier while ref_size is the product these primers give. The 21 bp unit published there confirms the unit derived from the reference for this locus, whose motif this paper prints only as Complex. check-scheme against Ames Ancestor reproduces all 15 loci with exactly one product of the published reference size, at word size 11 and without the rescue pass. The publication's locations are coordinates in the A2012 numbering rather than in Ames Ancestor, so they were compared by span length; all eight older loci reproduce their published span exactly. Each of the seven reverse primers this panel adds begins with a 5' G that the genome does not carry, so six of them report one primer mismatch and the product is one base longer than the genomic span; the primers are kept as published because that is what a real reaction amplifies, and the published reference sizes already include that base. Allowing for it, six of the seven new loci agree with their published span, four with the base excluded and two with it included, so the publication is not consistent about whether it is counted. BaVNTR19 does not agree: its published span is 124 bp against 96 bp measured here, and that is a mistake in the publication rather than a strain difference, because the MLVAbank identifier for the same locus also gives 96 bp. A run on the reference returns the published copy number at every locus with a residual of zero, profile 6-4-5-20-4-4-16-4-20-2-7-9-13-53-17. patterns are kept only for the six loci whose published copy number equals the number of times the published motif occurs in the reference, so the tandem array cross-check is active on those and skipped on the rest, where it would contradict the published number; unit_mismatches is left at its default. BaVNTR32, vrrB1, vrrB2, vrrC1 and vrrC2 have no motif in the table, which prints them as Complex or, for vrrB1, as a 9 bp degenerate repeat. Two loci are left without a pattern although their motif is known, because counting it disagrees with the published number: the pXO2-at array holds ten TA units where the panel numbers the reference 9, and the BaVNTR16 array holds 20 published units of ACATTTAC of which only four are perfect copies. An allele in this panel is therefore not always a literal count of whole units in the reference. vrrB1 and vrrB2 hold 20 and 13 units of 9 bp in a 229 and a 153 bp product, leaving 49 and 36 bp outside the array, less than their two primers occupy, so for these two loci the primers lie inside the repeat array; the allele formula needs only the size and the copy number to be consistent, which they are. vrrB1 with vrrB2 and vrrC1 with vrrC2 are adjacent paralogues whose amplicons overlap in the reference by 27 and 36 bp, so a rearrangement there can move both members of a pair. rounding and allele_tolerance are not from the paper and should be tuned on control strains.
