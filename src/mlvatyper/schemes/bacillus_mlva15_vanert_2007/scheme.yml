name: bacillus_mlva15_vanert_2007
organism: Bacillus anthracis
citation: Van Ert MN, Easterday WR, Huynh LY, Okinaka RT, Hugh-Jones ME, Ravel J, Zanecki SR, Pearson T, Simonson TS, U'Ren JM, Kachur SM, Leadem-Dougherty RR, Rhoton SD, Zinser G, Farlow J, Coker PR, Smith KL, Wang B, Kenefic LJ, Fraser-Liggett CM, Wagner DM, Keim P. Global genetic population structure of Bacillus anthracis. PLoS One 2007;2:e461. doi:10.1371/journal.pone.0000461
