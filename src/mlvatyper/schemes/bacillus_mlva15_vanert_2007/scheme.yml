allele_tolerance: 0.25
notes: MLVA-15 extends the MLVA-8 panel of Keim et al. 2000 with seven loci, BaVNTR12, BaVNTR16, BaVNTR17, BaVNTR19, BaVNTR23, BaVNTR32 and BaVNTR35, and keeps the eight older loci with the same primers, so bacillus_mlva8_keim_2000 is an exact subset of this scheme in primers and reference values. The two are not interchangeable: an 8 digit and a 15 digit code are different identifiers, and primers.sts here follows the published primer table, which is ordered by multiplex reaction rather than in the Keim order, so the two profile strings do not line up locus for locus. Multiplex reactions, which this scheme does not otherwise record: 7-1 is BaVNTR12, BaVNTR19 and BaVNTR35; 7-2 is BaVNTR16 and BaVNTR23; 7-3 is BaVNTR17 and BaVNTR32; 8-1 is vrrA, vrrB1 and CG3; 8-2 is pXO1-aat, pXO2-at and vrrB2; 8-3 is vrrC1; 8-4 is vrrC2. Eleven loci are chromosomal; pXO1-aat is on pXO1 and BaVNTR16, BaVNTR17 and pXO2-at are on pXO2, so an isolate that has lost a plasmid gives no product for the loci on it, reported as NOT_DETECTED rather than as an allele. The reference carries both plasmids. Dye, on the forward or reverse primer as printed: BaVNTR12 forward NED, BaVNTR19 forward 6-FAM, BaVNTR35 forward PET, BaVNTR16 forward 6-FAM, BaVNTR23 forward PET, BaVNTR17 forward NED, BaVNTR32 forward VIC, vrrA forward VIC, vrrB1 forward VIC, CG3 forward NED, pXO1-aat forward VIC, pXO2-at forward PET, vrrB2 forward 6-FAM, vrrC1 reverse 6-FAM, vrrC2 forward PET. The prefix is not part of the oligonucleotide and is not in primers.sts. The table's primer concentrations, 0.10 to 0.60 uM, are properties of the assay and are not used here. The dye assignment of vrrA, vrrB1, CG3, pXO1-aat and vrrB2 differs from the one in Keim et al. 2000, which bacillus_mlva8_keim_2000 records. ref_size is the product length measured in Ames Ancestor: every locus gives exactly one product, all are searchable at word size 11 and none needs the rescue pass. The publication's locations are coordinates in the A2012 numbering rather than in Ames Ancestor, so they were compared by span length. All eight MLVA-8 loci reproduce their published span exactly. Each of the seven new reverse primers begins with a 5' G that the genome does not carry, so six of them report one primer mismatch and the product is one base longer than the genomic span; the primers are kept as published because that is what a real reaction amplifies. Allowing for that base, six of the seven new loci agree with their published span, four with the base excluded and two with it included, so the publication is not consistent about whether it is counted. BaVNTR19 does not agree: 96 bp here against a published span of 124, a difference that is not a whole number of TAT units, so it is not a simple allele difference and could not be settled without the A2012 sequence. The repeat motifs of the seven new loci are the published ones, except BaVNTR32, whose motif is given only as Complex and whose 21 bp unit is derived from the reference. The motifs the table gives for the eight older loci corroborate the units derived in bacillus_mlva8_keim_2000. THE COPY NUMBERS ARE NOT PUBLISHED VALUES: the table carries motifs, locations and primers but no allele definitions, so ref_repeats is the count the tandem array counter returns for the stored motif at the default mismatch allowance, and MLVA-15 alleles are canonically assigned from fragment size against the published allele table. A count here may therefore be offset from the canonical allele by a constant, and a profile from this scheme must not be compared with published MLVA-15 genotypes until the values are confirmed against that table; supplying it as bins.tsv is the better fix. Thirteen loci carry a stored pattern and so an active repeat count cross-check; vrrC1 and vrrC2 do not, because their 36 bp arrays are too imperfect to count without a mismatch allowance loose enough to merge unrelated windows, so unit_mismatches is left at its default. vrrB1 with vrrB2 and vrrC1 with vrrC2 are adjacent paralogues whose amplicons overlap in the reference by 27 and 36 bp, so a rearrangement there can move both members of a pair. A run on the reference returns 6-4-5-4-4-4-11-4-3-2-7-10-2-7-8 with a residual of zero at every locus. rounding and allele_tolerance are not from the paper and should be tuned on control strains.
