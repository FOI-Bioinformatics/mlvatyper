notes: ref_size is the product length measured in the LVS assembly GCA_000009245.1 by in silico PCR with these primers, outer primer edge to outer primer edge; all 11 markers give exactly one product of that size, at word size 11 and without the rescue pass. ALL ELEVEN LOCI CALL. The source table gives primers only, so ten loci take their unit and copy number from the bundled scheme francisella_johansson_2004, which counts the same arrays and carries the published SCHU S4 copy numbers of Johansson et al. 2004 Table 2, and the eleventh, Ft-M20B, is called from a bins table under a convention of this scheme. The copy number of the ten comes from calibrating through SCHU S4: the array is the same DNA whichever primers flank it, so this scheme's SCHU S4 product minus the array the Johansson scheme counts there gives this scheme's flank, which fixes the copy number in LVS. THE CALIBRATION WAS TESTED ON 22 FRANCISELLA GENOMES whose identity was read from the assembly headers: nine subspecies tularensis, three holarctica, one mediasiatica and nine novicida. Every flank gives a whole number of repeats in LVS. Because both schemes count the same array their alleles must agree for any strain, and at the nine loci other than Ft-M20 all 112 comparisons in the 13 genomes outside novicida and all 33 in novicida do. At Ft-M20 they differ in 3 of 13 and in 9 of 9, as expected, since Johansson amplifies Ft-M20 as one product that the insertion split off here as Ft-M20B lengthens. The scale is the published Johansson one. The units also obey the constant flank rule at eight of the ten loci in the 13 genomes outside novicida; Ft-M22 and Ft-M24 do not, their steps of 19 bp, and 5 and 16 bp, pointing to indels in the flank, so some strains give a fractional allele there that is flagged INTERMEDIATE and not rounded. THE FT-M20B ALLELE IS A CONVENTION OF THIS SCHEME AND NOT A PUBLISHED VALUE. Vogler et al. split the Johansson Ft-M20 locus into Ft-M20A, the original 12 bp repeat, and Ft-M20B, a roughly 200 bp insertion with a separate 15 bp repeat, present in type A.II and novicida isolates and absent from the others, which give a monomorphic 153 bp product. No publication gives an Ft-M20B copy number. In 22 genomes the insertion-bearing products are 351, 366, 381, 396 and 411 bp, five sizes in steps of exactly 15 bp with the same 106 bp left flank and 200 bp right flank, which confirms the 15 bp unit and not the 12 bp that Myrtennas et al. 2020 list, a figure their table repeats from Ft-M20A. The 153 bp product has no insertion and so no array, allele 0; an earlier note that it held one copy was wrong, because the 15 bp sequence counted lies inside the forward primer. It is not on the 15 bp ladder, differing from 351 bp by 198 bp, so the repeat formula cannot link the two and the locus is called from bins.tsv: 0 at 153 bp and (size - 306) / 15 above it, 3 to 7 at the five sizes seen. An unlisted size is reported OFF_TABLE. Each array is a diverged lead block, n - 2 exact copies of GACCAAGGTAATAAT and a diverged terminal block, so counting the exact copies alone would give 1 to 5, two lower than the allele here. THE LOCUS NAMES OF THE TWO SCHEMES DIFFER ONLY IN SPELLING, Ft-M02 here against Ft-M2 in francisella_johansson_2004, with Ft-M20 there split here into Ft-M20A and Ft-M20B. The two amplify different fragments and are anchored on different strains, so their product sizes are not comparable even though their alleles are. Every primer carries a 5' G that the genome does not, so ref_size is valid only for the primers exactly as written.
