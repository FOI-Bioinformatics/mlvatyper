name: francisella_vogler_2008
organism: Francisella tularensis
citation: Vogler AJ, et al. An optimized, multiplexed multi-locus variable-number tandem repeat analysis system for genotyping Francisella tularensis. Lett Appl Microbiol 2008;48:140-144. doi:10.1111/j.1472-765X.2008.02484.x
url: https://doi.org/10.1111/j.1472-765X.2008.02484.x (supplementary Table S1, primers used in Francisella tularensis MLVA)
reference: strain LVS (subsp. holarctica), chromosome AM233362.1 (RefSeq NC_007880.1) - anchor strain chosen here, not specified by Table S1
assembly: GCA_000009245.1
retrieved: 2026-10-24
rounding: nearest
allele_tolerance: 0.25
notes: ref_size is the product length measured in the LVS assembly GCA_000009245.1 by in silico PCR with these primers, outer primer edge to outer primer edge; all 11 markers give exactly one product. unit_length, ref_repeats and patterns are still empty because Table S1 gives primers, PCR mix, concentration and dye only, with no repeat unit lengths, consensus repeats or copy numbers, so no allele can be called yet; take the unit lengths and consensus repeats from Johansson et al. 2004 J Bacteriol 186:5808-5818 (doi:10.1128/JB.186.17.5808-5818.2004), which defines these loci, and count ref_repeats in the LVS amplicons so that it matches the ref_size recorded here. Every primer carries a non-genomic 5' G: removing that base from both primers of a pair clears all primer mismatches, which 7 of the 11 markers otherwise report, and shortens every product by 2 bp, so ref_size is valid only for the primers exactly as written. primers.sts expected size is a deliberately generous 80-1200 window for every marker, not a reference product; it only bounds the search and does not affect allele calls. Locus ids are the published Table S1 names; the Vogler primers are second-generation redesigns (-2F/-2R) of the Johansson loci, so Johansson amplicon sizes do NOT transfer and only his unit lengths, consensus repeats and copy numbers are reusable. Ft-M20 is split into two separately amplified markers Ft-M20A and Ft-M20B; per Table S1 footnote their primers Ft-M20-2AR and Ft-M20-2BF overlap and the two cannot be run in the same PCR, which is why they sit in mixes 2 and 3A. Ft-M05-2R and Ft-M10-2R are the same oligo and the redesign did not make it locus-specific: without its 5' G it occurs 50 times in SCHU S4 and 56 times in LVS, inside a conserved element of at least 220 bp present in about 48 copies, so those two products are separated by size alone and an isolate whose nearby element copy has moved may give a wrong product; check that each product is assigned to the intended marker and consider tightening the search window now that the reference sizes are known. Ft-M20-2AF is added as a 1:1 mix of 6FAM-labelled and unlabelled (cold) primer to reduce signal for multiplexing - one sequence, listed once. Ft-M20B carries its dye on the reverse primer (HEX), all other markers on the forward primer. PCR mixes from Table S1: 1A Ft-M22 Ft-M23 Ft-M24, 1B Ft-M03, 2 Ft-M20A Ft-M10 Ft-M05, 3A Ft-M04 Ft-M20B Ft-M06, 3B Ft-M02. Primers are transcribed from Table S1 and uppercased; trailing whitespace in the Ft-M20-2AF cells was stripped. Publication year is given as 2008 per the DOI; some indexes date volume 48 issue 1 to 2009, and the full author list was not verified so the citation uses et al. The assembly accession was confirmed by download: GCA_000009245.1 is F. tularensis subsp. holarctica LVS, AM233362.1. Prefer SCHU S4 (subsp. tularensis, AJ749949.2, GCA_000008985.1) as the anchor if typing subsp. tularensis, which requires re-measuring ref_size against that assembly. rounding and allele_tolerance are not from the paper and should be tuned on control strains. The unit length of seven of the eleven loci is now recorded, filled where a cross strain test and the bundled francisella_johansson_2004 scheme agree independently: amplifying this panel in seven Francisella genomes shows the product sizes of a locus differing by whole multiples of a unit, and that unit matches the one derived from a different primer pair and a different reference in that scheme. The locus names of the two schemes differ only in padding, Ft-M02 here against Ft-M2 there, and that agreement confirms they are the same VNTR; Ft-M20 there is split here into Ft-M20A and Ft-M20B. The two still use different primers and different references, LVS here and SCHU S4 there, so their sizes and alleles are not interchangeable. ref_repeats is still not filled anywhere, because the cross strain test fixes a flanking length only up to a whole number of repeats and cannot supply the absolute count, so every marker remains sized rather than called.
