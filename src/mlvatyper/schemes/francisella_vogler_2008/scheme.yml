name: francisella_vogler_2008
organism: Francisella tularensis
citation: Vogler AJ, Birdsell D, Wagner DM, Keim P. An optimized, multiplexed multi-locus variable-number tandem repeat analysis system for genotyping Francisella tularensis. Lett Appl Microbiol 2009;48:140-144. doi:10.1111/j.1472-765X.2008.02484.x, supplementary Table S1 (primers used in Francisella tularensis MLVA)
