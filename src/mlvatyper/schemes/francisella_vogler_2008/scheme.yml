notes: ref_size is the product length measured in the LVS assembly GCA_000009245.1 by in silico PCR with these primers, outer primer edge to outer primer edge; all 11 markers give exactly one product of that size, at word size 11 and without the rescue pass. TEN OF THE ELEVEN LOCI CAN BE CALLED AND ONE CANNOT. The source table gives primers only, so the unit and copy number of ten loci are taken from the bundled scheme francisella_johansson_2004, which counts the same arrays and now carries the published copy numbers of Johansson et al. 2004 Table 2. The unit rests on two lines of evidence that agree: a cross strain test over seven Francisella genomes, in which a locus keeps one flanking length so its product sizes differ by whole multiples of the unit; and the unit the Johansson scheme records for the same locus. The copy number comes from calibrating through SCHU S4: the array is the same DNA whichever primers flank it, so this scheme's SCHU S4 product minus the array the Johansson scheme counts there gives this scheme's flank, which fixes the copy number in LVS. The calibration passes two checks: every flank yields a whole number of repeats in LVS, and because both schemes count the same array their alleles agree for any strain, across every genome where both amplify. The scale is the published Johansson one, so the two Francisella schemes are now consistent with each other and with the publication. A few loci give a fractional allele in some lineages, from a flank indel or the shared repeat family, flagged INTERMEDIATE; the reference call is a whole number at every called locus. Ft-M20B is the one locus left uncallable: Vogler et al. split the Johansson Ft-M20 locus into Ft-M20A, the original 12 bp repeat, and Ft-M20B, a roughly 200 bp insertion with a separate 15 bp repeat; the 15 bp unit is published and recorded here, but no publication gives its copy number, and the insertion is monomorphic at 153 bp in subspecies holarctica, which LVS belongs to, so its reference array is a single faint copy that cannot be pinned to an absolute count, and it is diverse only in subspecies tularensis. THE LOCUS NAMES OF THE TWO SCHEMES DIFFER ONLY IN SPELLING, Ft-M02 here against Ft-M2 in francisella_johansson_2004, with Ft-M20 there split here into Ft-M20A and Ft-M20B. The two amplify different fragments and are anchored on different strains, so their product sizes are not comparable even though their alleles are. Every primer carries a 5' G that the genome does not, so ref_size is valid only for the primers exactly as written.
