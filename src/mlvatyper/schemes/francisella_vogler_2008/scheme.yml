citation: Vogler AJ, et al. An optimized, multiplexed multi-locus variable-number tandem repeat analysis system for genotyping Francisella tularensis. Lett Appl Microbiol 2008;48:140-144. doi:10.1111/j.1472-765X.2008.02484.x
