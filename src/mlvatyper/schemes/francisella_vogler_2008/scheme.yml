notes: ref_size is the product length measured in the LVS assembly GCA_000009245.1 by in silico PCR with these primers, outer primer edge to outer primer edge; all 11 markers give exactly one product of that size, at word size 11 and without the rescue pass. SEVEN OF THE ELEVEN LOCI CAN NOW BE CALLED AND FOUR CANNOT. The source table gives primers only, with no repeat unit, no copy number and no reference values, so both quantities an allele needs are filled from the bundled scheme francisella_johansson_2004, which counts the same arrays in SCHU S4. The unit comes from two independent lines of evidence that agree: a cross strain test, in which a locus keeps one flanking length so its product sizes must differ by whole multiples of the unit, run over seven Francisella genomes, SCHU S4, LVS, OSU18, WY96-3418, FSC198, NE061598 and TI0902; and the unit that scheme derives for the same locus from a different primer pair and a different reference. The copy number comes from a calibration through a shared genome: the array a locus contains is the same piece of DNA whichever primers flank it, so measuring this scheme's product in SCHU S4 and subtracting the array the Johansson scheme counts there gives this scheme's flanking length, which then fixes the copy number in LVS. The calibration is checked two ways and passes both. All seven flanking lengths yield a whole number of repeats in LVS, which a wrong unit or a wrong locus pairing would not. And because both schemes then count the same array, their alleles must agree for any strain: across the five genomes where both panels amplify, all 35 locus and strain pairs give the same allele. THE ALLELE SCALE IS INHERITED, NOT PUBLISHED. The Johansson counts used here are themselves derived from its reference rather than read from that publication, so an allele at these seven loci is the number of repeats this pair of schemes counts and may be offset from the allele name used in either publication by a constant per locus. The two bundled Francisella schemes are now consistent with each other, which they were not before, but neither is guaranteed to match published allele names until a published definition table is supplied. Ft-M20B, Ft-M22, Ft-M23 and Ft-M24 are still sized only: the Johansson panel has no count for the last three either, and Ft-M20B gives one size across all seven genomes so the cross strain test says nothing about it. THE LOCUS NAMES OF THE TWO SCHEMES DIFFER ONLY IN SPELLING. This scheme pads the number, Ft-M02, where francisella_johansson_2004 does not, Ft-M2, and the agreement above confirms the padded and unpadded names are the same VNTR, with Ft-M20 there split here into Ft-M20A and Ft-M20B. The two still amplify different fragments and are anchored on different strains, so their product sizes are not comparable even though their alleles now are. Every primer carries a 5' G that the genome does not, so ref_size is valid only for the primers exactly as written.
