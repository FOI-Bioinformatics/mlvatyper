name: mtb_miru15_supply_2006
organism: Mycobacterium tuberculosis
citation: Supply P, Allix C, Lesjean S, Cardoso-Oelemann M, Rusch-Gerdes S, Willery E, et al. Proposal for standardization of optimized mycobacterial interspersed repetitive unit-polymorphic tandem repeat typing of Mycobacterium tuberculosis. J Clin Microbiol 2006;44:4498-4510. doi:10.1128/JCM.01392-06
url: https://doi.org/10.1128/JCM.01392-06 (set, multiplex, locus, repeat unit length and primer table)
reference: strain H37Rv, chromosome AL123456.3 - confirmed by downloading the assembly
assembly: GCA_000195955.2
retrieved: 2026-10-24
rounding: intermediate
allele_tolerance: 0.25
notes: The 15 locus discriminatory subset, multiplex mixes 1 to 5, of the same standardised scheme. mtb_miru24_supply_2006 holds all 24 loci, and the two are not interchangeable because a 15 digit code and a 24 digit code are different identifiers; the primers, unit lengths and reference values are identical at the shared loci. All 15 loci are callable and H37Rv types as 2-3-3-1-3-2-1-5-3-2-3-3-2-5-2 with a residual of zero everywhere, which is the 24 locus profile restricted to these loci. Mixes: 1 is 580, 2996, 802; 2 is 960, 1644, 3192; 3 is 424, 577, 2165; 4 is 2401, 3690, 4156; 5 is 2163b, 1955, 4052. Loci are named by position, the identifier the standardised code is built from, and the label column carries the first published alias with spaces removed. primers.sts lists them in ascending position order, which is the order of the published digit code, so profile strings come out in that order. Fluorescent label prefixes in the primer table are not part of the oligonucleotides and were stripped; which primer carries which dye is listed below. ref_size is the product length measured in H37Rv by in silico PCR with these primers: every locus gives exactly one product, all are searchable at word size 11, none needs the rescue pass and none has a primer mismatch, and the publication's table gives no amplicon sizes to compare with. THE COPY NUMBERS ARE NOT PUBLISHED VALUES. The supplied table carries repeat unit lengths and primers only, so ref_repeats is derived from the reference assembly three ways, all recorded per locus in markers.tsv: repeat detection that also reproduced the published unit length; for a few loci, two adjacent copies of the published unit length that differ by a few bases and that the detector skipped, counted with a mismatch allowance; and for a few others, the absence of any adjacent pair reaching 85 per cent identity anywhere in the amplicon, which means the array is a single unit. MIRU-VNTR alleles are canonically assigned from amplicon size with the published allele calling table, which was not supplied, so a derived copy number may be offset from the canonical allele and a profile from this scheme must not be compared with published MIRU codes until the values are confirmed against that table; supplying it as bins.tsv is the better fix. patterns are filled only for the loci resolved by the detector, so the tandem array cross-check is active on those and skipped on the rest: a single unit forms no array to check, and counting an imperfect array needs a mismatch allowance that inflates the count at loci 3171 and 4156, so unit_mismatches is deliberately left at its default. primers.sts expected size is a generous 60-1500 window rather than a reference product; it only bounds the search, does not affect allele calls, and could be tightened now that the reference sizes are known. Aliases: 154 MIRU 2; 424 Mtub04; 577 ETR C; 580 MIRU 4 and ETR D; 802 MIRU 40; 960 MIRU 10; 1644 MIRU 16; 1955 Mtub21; 2059 MIRU 20; 2163b QUB-11b; 2165 ETR A; 2347 Mtub29; 2401 Mtub30; 2461 ETR B; 2531 MIRU 23; 2687 MIRU 24; 2996 MIRU 26; 3007 MIRU 27 and QUB-5; 3171 Mtub34; 3192 MIRU 31 and ETR E; 3690 Mtub39; 4052 QUB-26; 4156 QUB-4156; 4348 MIRU 39. Dye, on the first or second primer as printed: 580 first/FAM, 2996 second/VIC, 802 first/NED, 960 second/FAM, 1644 second/VIC, 3192 second/NED, 424 second/FAM, 577 first/VIC, 2165 first/NED, 2401 first/FAM, 3690 first/VIC, 4156 second/NED, 2163b second/FAM, 1955 first/VIC, 4052 first/NED, 154 second/FAM, 2531 first/VIC, 4348 second/NED, 2059 first/FAM, 2687 second/VIC, 3007 second/NED, 2347 first/FAM, 2461 first/VIC, 3171 second/NED. rounding and allele_tolerance are not from the paper and should be tuned on control strains.
