# Salmonella enterica serovar Enteritidis, the nine locus multicolour MLVA of Malorny et al. 2008.
name: salmonella_enteritidis_mlva9_malorny_2008
organism: Salmonella enterica subsp. enterica serovar Enteritidis
citation: Malorny B, Junker E, Helmuth R. Multi-locus variable-number tandem repeat analysis for outbreak studies of Salmonella enterica serotype Enteritidis. BMC Microbiol 2008;8:84. doi:10.1186/1471-2180-8-84, Table 1 (repeat sizes, repeat numbers in NCTC 13349 and the Boxrud locus names), Table 2 (primers and sequence lengths), Table 3 (observed product size ranges) and Methods (the locus order that defines the MLVA type)
url: https://doi.org/10.1186/1471-2180-8-84 (open access; Tables 1, 2 and 3)
reference: Salmonella enterica subsp. enterica serovar Enteritidis str. P125109, which is NCTC 13349, chromosome AM933172.1; ref_repeats is the repeat number Table 1 gives for that strain and ref_size is the product these primers give in its assembly
assembly: GCA_000009505.1
retrieved: 2026-11-03
rounding: intermediate
allele_tolerance: 0.25
notes: Nine loci amplified in one multiplex reaction and sized by multicolour capillary electrophoresis. The loci are kept in the order the Methods give for the MLVA type, SENTR7-SENTR5-SENTR6-SENTR2-SENTR3-SENTR4-SE3-SENTR1-SE7, so a profile string is in the published order rather than needing to be reordered. THIS SCHEME REPORTS REPEAT NUMBERS AND THE PAPER'S MLVA TYPE IS NOT A REPEAT NUMBER STRING. The Methods assign each distinct fragment size at a locus an arbitrary allele number, and a published type such as 3-4-2-4-1-3-1-2-5 is a string of those indices; the paper does not print the table that maps an index to a size, so those types cannot be derived here and a profile from this scheme must not be compared with them directly. Table 3 gives the number of alleles seen at each locus, from 3 to 11, but not their sizes. Seven of the nine loci are named in this paper and two, SE-3 and SE-7, are adapted from Boxrud et al.; five of the SENTR loci also carry a Boxrud name, which the label column keeps, and SENTR2 is locus STTR7 of Lindstedt et al. The reference strain is NCTC 13349, phage type 4, whose genome was the one searched for tandem repeats; it is the sequenced strain P125109, so the scheme is anchored on that assembly, and Table 1 reports the same repeat number for the separately sequenced isolate 07-2642 at every locus. SEVEN OF THE NINE REPEAT NUMBERS ARE FRACTIONAL because the array ends in a partial unit, so the alleles of those markers lie on a grid offset from the integers and a call on that grid is reported as n.m rather than flagged INTERMEDIATE; only SENTR5 and SE-3 are whole numbers. Table 2 gives two sizes per locus, the DNA sequence length based on NCTC 13349 and the size the ABI 310 analyser reported. The capillary size runs 0 to 26 bp short of the sequence length and is an assay property, so it is not used. FOUR OF THE PUBLISHED SEQUENCE LENGTHS ARE NOT THE PRODUCT THEIR OWN PRIMERS GIVE in the assembly of the strain they are attributed to: SENTR2 measures 518 bp against 519 published, SENTR3 493 against 494, SENTR4 119 against 120 and SE-7 719 against 717. Every primer matches that genome exactly, with no mismatch and no second product, so the measured length is used. No allele moves as a result, because the largest of the four differences is a seventh of a repeat and the rest are a fortieth or less, all far inside the allele tolerance. The 5' dye label of each forward primer, FAM, HEX or TET, is an assay property and is not part of the oligonucleotide written to primers.sts. No repeat unit sequences are published, so alleles are called from amplicon length alone and the tandem count is not a cross-check; SE-7 could not be counted in any case, because its 61 bp unit is a conserved 29 bp part followed by a variable 32 bp part. The search windows are derived rather than published: each runs from the length of the amplicon with no repeat to five repeats beyond the largest product Table 3 reports, after that table's capillary sizes are corrected to sequence lengths by the per locus offset Table 2 shows. The bundled scheme STm_ECDC is for serovar Typhimurium and shares no locus with this one. rounding and allele_tolerance are not from the paper and should be tuned on control strains.
