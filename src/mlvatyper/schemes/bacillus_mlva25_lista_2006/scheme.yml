# Bacillus anthracis, the 25 locus MLVA panel of Lista et al. 2006 run as four multiplex PCRs.
name: bacillus_mlva25_lista_2006
organism: Bacillus anthracis
citation: Lista F, Faggioni G, Valjevac S, Ciammaruconi A, Vaissaire J, le Doujet C, Gorge O, De Santis R, Carattoli A, Ciervo A, Fasanella A, Orsini F, D'Amelio R, Pourcel C, Cassone A, Vergnaud G. Genotyping of Bacillus anthracis strains based on automated capillary 25-loci multiple locus variable-number tandem repeats analysis. BMC Microbiol 2006;6:33. doi:10.1186/1471-2180-6-33, Table 2 (panel composition, repeat unit lengths and fragment size ranges), Table 3 (sequenced amplicon sizes against repeat numbers) and Methods (the Ames MLVA-8 code in base pairs and in repeats)
url: https://doi.org/10.1186/1471-2180-6-33 (open access; Tables 2 and 3)
reference: Bacillus anthracis str. Ames Ancestor, chromosome AE017334.2 with plasmids pXO1 AE017336.2 and pXO2 AE017335.3; ref_size is the in silico product in that assembly and ref_repeats is the repeat number Table 3 pairs with that size
assembly: GCA_000008445.1
retrieved: 2026-11-02
rounding: intermediate
allele_tolerance: 0.25
notes: MLVA-25 is the eight MLVA-8 loci of Keim et al. 2000 and seventeen bams loci. The paper describes it as 21 loci from earlier work, 14 of them added by Le Fleche et al., plus four new markers found in genome sequence, bams34, bams44, bams51 and bams53; bams7 of the MLVA-20 set is dropped because its alleles run to about 2 kb and are too long for capillary sizing. THE PAPER PUBLISHES NO PRIMER SEQUENCES. It cites the earlier studies for the 21 older loci and the GPMS database for the four new ones, so the primers here are the MLVAbank ones already bundled as bacillus_mlva31_mlvabank, of which this panel is the first 25 loci; the search windows are carried over from that scheme and are wider than the sizes this paper reports. What the paper does supply, and what this scheme takes from it, is the panel composition, the repeat unit lengths, the fragment size ranges and an explicit table of sequenced amplicon size against repeat number. The locus order is the one the Methods uses for the MLVA-8 code, vrrA first and the two plasmid loci last, then the bams loci in numerical order, so the first eight digits of a profile line up with bacillus_mlva8_keim_2000. Eleven loci are chromosomal in the MLVA-8 part and all seventeen bams loci are chromosomal; pXO1-aat is on pXO1 and pXO2-at is on pXO2, so an isolate that has lost a plasmid gives no product there and is reported as NOT_DETECTED rather than as an allele. The reference carries both plasmids. The four multiplex reactions, which this scheme does not otherwise record, are A for CG3, bams44, bams3, vrrB2, bams5, bams15, bams1 and vrrC1; B for bams13, vrrB1, bams28, vrrC2, bams53 and bams31; C for vrrA, bams25, bams21, bams34 and bams24; D for bams51, bams22, bams23, bams30, pXO1 and pXO2. Primer concentrations of 0.06 to 0.60 uM and the three dye labels are properties of the assay and are not used here. THE REPEAT NUMBERING DIFFERS FROM THE OTHER BUNDLED BACILLUS SCHEMES. bacillus_mlva31_mlvabank and bacillus_mlva8_keim_2000 take their copy numbers from the MLVAbank locus identifiers, and those count the same reference products differently at five loci: vrrA 4 against 10 here, vrrB1 20 against 16, vrrB2 13 against 6, pXO2-at 9 against 10 and bams34 11 against 9. Every reference size agrees exactly. A profile from this scheme is therefore comparable with published MLVA-25 genotypes while a profile from those schemes is not, and the two numberings must not be mixed. The paper is explicit that the alleles are the repeat numbers rather than the earlier allele codes, and it also lists those codes, which run to small integers and are not used here. Table 3 is a size to repeat number table for all 25 loci and would be the better basis for calling than the reference formula; it is supplied as bins.tsv alongside this file. Two of its loci are not internally consistent, bams34 and the lower rows of bams13, and this is recorded in bins.tsv. check-scheme against Ames Ancestor reproduces all 25 loci with exactly one product of the stated size, at word size 11 and without the rescue pass. Every one of the 25 sizes falls inside the fragment size range Table 2 reports, and 24 of them are also a row of Table 3; vrrC1 is the exception, where the Methods corrects the published 583 bp to 580 bp, which is the size measured here. Table 2 gives bams13 a 39 bp repeat unit, which disagrees with its own Table 3, with the sequenced allele sizes and with the reference, all of which give 9 bp; 39 is treated as an error in Table 2. patterns are kept only for CG3 and pXO1-aat, whose published repeat number equals the number of times the motif occurs in the reference, so the tandem array cross-check is active there and skipped elsewhere, where it would contradict the published number. rounding and allele_tolerance are not from the paper and should be tuned on control strains.
