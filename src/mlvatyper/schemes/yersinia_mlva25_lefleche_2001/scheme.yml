# Yersinia pestis MLVA-25 of Le Fleche et al. 2001: scheme metadata, one key: value per line.
name: yersinia_mlva25_lefleche_2001
organism: Yersinia pestis
citation: Le Fleche P, Hauck Y, Onteniente L, Prieur A, Denoeud F, Ramisse V, Sylvestre P, Benson G, Ramisse F, Vergnaud G. A tandem repeats database for bacterial genomes: application to the genotyping of Yersinia pestis and Bacillus anthracis. BMC Microbiol 2001;1:2. doi:10.1186/1471-2180-1-2; Pourcel C, Andre-Mazeaud F, Neubauer H, Ramisse F, Vergnaud G. Tandem repeats analysis for the high resolution phylogenetic analysis of Yersinia pestis. BMC Microbiol 2004;4:22. doi:10.1186/1471-2180-4-22
url: https://doi.org/10.1186/1471-2180-1-2 (Table 1, the 25 loci polymorphic among Y. pestis, with primers, unit length, repeat number, expected CO92 product and size range)
reference: strain CO92, chromosome AL590842.1 - confirmed by downloading the assembly; all 25 loci are chromosomal, and none is on the plasmids AL117189.1, AL117211.1 or AL109969.1
assembly: GCA_000009065.1
retrieved: 2026-10-25
rounding: intermediate
allele_tolerance: 0.25
notes: The 25 loci of Le Fleche et al. 2001 that are polymorphic among Yersinia pestis, which are the 25 markers Pourcel et al. 2004 used, in the order of the source table; that order is by descending repeat number rather than by position, and primers.sts keeps it so profile strings come out in the published order. The locus ids are the short ms names and the label column carries the full locus name, which gives the position of the locus in the CO92 chromosome in kb. All three reference values are published: unit length, repeat number and the expected CO92 product all come from the source table unchanged. check-scheme against CO92 reproduces every one of the 25 published products exactly, with one product per locus at word size 11, without the rescue pass and without a primer mismatch, and each product starts at the position its full locus name states, so both the sizes and the locus identities are confirmed. A run on the reference returns the published repeat number at every locus with a residual of zero, profile 8-8-11-9-9-33-10-9-9-8-8-7-7-7-7-7-7-7-7-7-6-6-6-6-6. ms40 is the one internal inconsistency in the source: its expected product is 214 bp while its published size range is 220-240 bp, and the measurement agrees with 214 bp. patterns is N/A at every locus, so the tandem array cross-check is off throughout and alleles rest on amplicon length, which is how this panel is numbered; the source gives no repeat motifs, the arrays are degenerate at 59 to 97 per cent conservation, and at no locus does the array in CO92 hold as many adjacent units as the published repeat number, which markers.tsv sets out. Repeat detection in the reference amplicons does reproduce the published unit length at 21 of the 25 loci; ms15, ms46 and ms51 give a different period and ms06 and ms54 give none, so an allele of ms46 or ms51 that disagrees with a database is worth checking against the unit length first. Six loci are also in yersinia_klevytska_2001 under the names the source gives as equivalents: ms04 is M58, ms05 is M59, ms07 is M37, ms20 is M51, ms45 is M42 and ms62 is M34. The equivalence holds in the reference, where the two amplicons of each pair overlap and the unit lengths are identical, but the two publications number the same arrays differently, for example three copies of M42 against seven of ms45, so a profile from this scheme is not interchangeable with one from that scheme. Pourcel et al. 2004 also report a seven marker subset for routine use, ms01, ms04, ms06, ms07, ms46, ms62 and ms70, which is not bundled separately. PCR conditions from the source, which this scheme does not otherwise record: 60 degrees annealing, 60 s extension and 2 per cent agarose for 23 loci, with a 90 s extension for ms06 and ms09. primers.sts expected size is a search window built from the published size range extended to the measured product, less 50 bp and plus 200 bp; it only bounds the search and does not affect allele calls. rounding and allele_tolerance are not from the publications and should be tuned on control strains.
