# Salmonella enterica serovar Typhimurium, the five locus MLVA scheme harmonised in the EU.
name: STm_ECDC
organism: Salmonella enterica subsp. enterica serovar Typhimurium
citation: Lindstedt BA, Vardund T, Aas L, Kapperud G. J Microbiol Methods 2004;59:163-172 (primers and loci); Larsson JT et al. Euro Surveill 2009;14(15):19174 (nomenclature, repeat numbers as actual counts); ECDC laboratory standard operating procedure for MLVA of Salmonella Typhimurium, Annex 1 (primer table, repeat sizes, LT2 sizes and size ranges)
url: https://www.eurosurveillance.org/content/10.2807/ese.14.15.19174-en
reference: Salmonella Typhimurium LT2, chromosome GenBank AE006468 and plasmid pSLT AE006471; ref_size is the in silico product in LT2, which equals the LT2 size given in the SOP, and ref_repeats is derived from the SOP size ranges (one repeat per unit length) and confirmed by exact tandem counts in the LT2 amplicons
assembly: GCF_000006945.2  # RefSeq assembly of LT2 (chromosome NC_003197.2 and plasmid pSLT NC_003277.2, the RefSeq copies of AE006468 and AE006471); downloaded by check-scheme
retrieved: 2026-10-23
notes: Profiles are STTR9-STTR5-STTR6-STTR10-STTR3 as actual repeat counts; the SOP reference strain STm-SSI01 is 6-9-13-10-211. Repeat units are counted exactly (unit_mismatches 0) because the nomenclature counts complete repeats and the degenerate end copies at STTR9, STTR5 and STTR6 would otherwise add one. The STS sizes are the LT2 products, so the search window follows the definitions (0 to --max-repeats repeats); the SOP gives the observed ranges 153-225, 205-343, 282-438, 329-497 and 232-616 bp. STTR10pl lies on the pSLT plasmid and can be absent. STTR3 is a compound locus of 27 bp and 33 bp units (three and about eleven in LT2) named by both counts, which the single unit formula cannot express, so it is reported by length only. The PulseNet US scheme for this serovar uses other loci and is not interconvertible.
rounding: intermediate
allele_tolerance: 0.25
unit_mismatches: 0
