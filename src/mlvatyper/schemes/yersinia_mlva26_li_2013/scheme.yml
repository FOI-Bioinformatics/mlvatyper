# Yersinia pestis, the hierarchical 14+12 VNTR genotyping scheme of Li et al. 2013.
name: yersinia_mlva26_li_2013
organism: Yersinia pestis
citation: Li Y, Cui Y, Cui B, Yan Y, Yang X, Wang H, Qi Z, Zhang Q, Xiao X, Guo Z, Ma C, Wang J, Song Y, Yang R. Features of variable number of tandem repeats in Yersinia pestis and the development of a hierarchical genotyping scheme. PLoS ONE 2013;8:e66567. doi:10.1371/journal.pone.0066567, Table S2 (primers for all 88 loci, with the reference values encoded in each locus name), Table 1 (motif lengths, CO92 positions and diversity indices) and Figure 4 with the Table 1 footnote (which loci make up the 14 and the 12)
url: https://doi.org/10.1371/journal.pone.0066567 (open access; Table S2 is the supplementary file journal.pone.0066567.s011)
reference: Yersinia pestis CO92, chromosome AL590842.1; ref_repeats is the CO92 repeat number encoded in the Table S2 locus name and ref_size is the product these primers give in that assembly, which differs from the encoded size at five loci
assembly: GCA_000009065.1
retrieved: 2026-11-02
rounding: intermediate
allele_tolerance: 0.25
notes: The paper surveys 88 VNTR loci in Y. pestis and selects 26 for a two step scheme. The first fourteen place an isolate in one of the major populations; the twelve added in the second step resolve it to a sub-population, and Figure 4 shows that only a few of the twelve are needed on any one branch. The two steps are bundled here as one 26 locus panel in that order, because the tool has no notion of a typing tier, so the first fourteen digits of a profile are the first step result and the last twelve extend it. The 14 are yp0718ms41, yp3057ms09, yp3060ms56, yp3236ms73, yp4425ms38, M15, M21, M58, M61, N0865, N2486, N2896, N2976 and N3779; the 12 are M22, M23, M25, M28, M29, M33, M34, M43, N1606, N2117, N2577 and N3773. The membership comes from the footnote to Table 1, which marks the two sets, and agrees with the loci named on the branches of Figure 4. Locus names follow the earlier nomenclatures the paper kept: M numbers are from Klevytska et al., yp numbers with an ms suffix are from Pourcel et al., and the nine N loci were first described here. M58 and M34 are also ms04 and ms62; the alias is recorded in markers.tsv rather than in the label so that the encoded values parse. Unit lengths and repeat numbers are published: Table S2 encodes both in every locus name, and the unit lengths agree with the motif lengths Table 1 gives independently for all 26. FIVE OF THE ENCODED AMPLICON SIZES ARE NOT THE PRODUCT THEIR OWN PRIMERS GIVE IN CO92. The measured lengths are yp0718ms41 217 against 218 encoded, yp4425ms38 233 against 251, M61 356 against 357, M29 231 against 233 and M34 225 against 255. In every one of the five the measured length equals the value an independently bundled scheme records for the same locus with the same primer pair, ms41 and ms38 of yersinia_mlva25_lefleche_2001 and M61, M29 and M34 of yersinia_klevytska_2001, and those schemes also record the same repeat number, so the encoded size is treated as an error in Table S2, the measured size is used and the published identifier is kept unchanged in the label. No allele is shifted by this. With that correction check-scheme against CO92 reproduces all 26 loci with exactly one product of the reference size, at word size 11 and without the rescue pass, and all 26 lie on the chromosome. One primer of M29 mismatches the reference by a single base. THE PRIMERS ARE NOT ALWAYS THOSE OF THE BUNDLED POURCEL PANEL FOR THE SAME LOCUS. Where this paper reuses the Klevytska primers for a locus that also carries a Pourcel name, the amplicon is a different one: M58 is 395 bp here while ms04 is 230 bp in yersinia_mlva25_lefleche_2001, and M34 is 225 bp while ms62 is 240 bp. The five loci this panel shares with that scheme under a yp name do use the same primers and agree on size and repeat number once the two corrections above are applied. The repeat numbering also differs from yersinia_klevytska_2001 at five of the shared M loci, M15 5 against 2, M22 13 against 12, M23 7 against 6.5, M25 22 against 20 and M58 8 against 7.5, so profiles from the three Yersinia schemes are not interchangeable. No repeat unit sequences are published for these loci, so alleles are called from amplicon length alone and the tandem count is not a cross-check. The search windows are derived rather than published: each runs from the length of the amplicon with no repeat to that length plus twenty-five repeats beyond the reference. rounding and allele_tolerance are not from the paper and should be tuned on control strains.
