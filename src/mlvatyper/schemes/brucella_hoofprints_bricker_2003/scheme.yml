# HOOF-Prints (Bricker et al. 2003): eight octameric VNTR loci, one key: value per line.
name: brucella_hoofprints_bricker_2003
organism: Brucella
citation: Bricker BJ, Ewalt DR, Halling SM. Brucella 'HOOF-Prints': strain typing by multi-locus analysis of variable number tandem repeats (VNTRs). BMC Microbiol 2003;3:15. doi:10.1186/1471-2180-3-15 (Table 2, primers; Figure 1, repeat counts in the three sequenced genomes)
url: https://doi.org/10.1186/1471-2180-3-15 (open access)
reference: Brucella abortus biovar 1 strain 9-941 (GenBank NC_006932.1 and NC_006933.1); ref_size is the product measured in the assembly and ref_repeats the count drawn for that strain in Figure 1
assembly: GCF_000008145.1
retrieved: 2026-11-12
mismatches: 5
rescue_indels: yes
interrupted_arrays: Locus-3, Locus-6, Locus-8
rounding: intermediate
allele_tolerance: 0.25
notes: The eight loci share one repeat unit, the octamer AGGGCAGT, and are numbered by the number of complete units in the amplicon, so an allele is directly a repeat count and no bin table is needed. The forward primers of Table 2 carry a 5' tail that does not match the template, and the two shared reverse primers (REV-1 for Locus-2, 7 and 8, REV-3 for the rest) differ from it at their 5' end as well, so mismatches is set to 5; the mismatches are the same in all three sequenced genomes, which is what distinguishes a tail from a transcription error. REV-3 holds two IUPAC codes. The paper gives no amplicon size table, so ref_size is measured in the reference assembly; at seven of the eight loci the product size of 9-941, 16M and 1330 minus eight times the count drawn in Figure 1 is the same number, which is what ties the measured sizes to the published counts. The exception is Locus-4, where B. suis 1330 is 11 bp longer than that offset, the offset the paper reports for B. suis biovar 1 and the strains whose alleles follow its ladder (B. canis, B. neotomae, B. ovis, B. suis biovars 2, 4 and 5); an allele from those lineages is one unit higher than the published name and must not be compared across the offset. The array at every locus opens with a partial unit (AGT, or GGCAGT at Locus-3) that the paper draws as a yellow box and excludes from the allele. At Locus-3, Locus-6 and Locus-8 the repeat detection counts that partial as a unit and so reports one more copy than the allele; these three are listed in interrupted_arrays, which turns off the tandem cross-check for them, and their alleles are unaffected because they are called from length. Locus-8 also carries the 9 bp variant aAGGGCAGT, which is a complete unit in the paper but is not one of the shipped patterns. Alleles rest on amplicon length, so a deletion in a flank shifts them: at Locus-1 the downstream flank of B. suis 1330 is 16 bp shorter than that of 9-941, which makes its 4 unit array the same length as the 2 unit array of 9-941 and gives it the allele 2. The repeat count cross-check reports this as COUNT_DISAGREES, which is the reason the patterns are shipped; read the count when that flag appears. Locus-9 of the paper is monomorphic and has no assay, so it is not part of the scheme. Bricker et al. also report that no product was obtained in vitro for Locus-1 and Locus-4 of 16M, and that some in vitro sizes disagree with the sizes predicted from the genomes, so in silico and capillary HOOF-Print alleles are not interchangeable. The assay predates MLVA-16 and shares no locus with it.
