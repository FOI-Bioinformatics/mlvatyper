# Staphylococcus aureus, the five locus MLVA of Sabat et al. 2003, read as a band pattern on a gel.
name: saureus_mlva5_sabat_2003
organism: Staphylococcus aureus
citation: Sabat A, Krzyszton-Russjan J, Strzalka W, Filipek R, Kosowska K, Hryniewicz W, Travis J, Potempa J. New method for typing Staphylococcus aureus strains: multiple-locus variable-number tandem repeat analysis of polymorphism and genetic relationships of clinical isolates. J Clin Microbiol 2003;41:1801-1804. doi:10.1128/JCM.41.4.1801-1804.2003, Table 2 (primers) and the Introduction (the repeat unit of each gene family)
url: https://doi.org/10.1128/JCM.41.4.1801-1804.2003 (Table 2; the paper has no table of sizes or repeat numbers)
reference: Staphylococcus aureus subsp. aureus NCTC 8325, chromosome CP000253.1, the control strain the paper types as isolate 34; ref_size is the product these primers give in that assembly and is not a published value
assembly: GCA_000013425.1
retrieved: 2026-11-03
known_multiple: sdr
rounding: intermediate
allele_tolerance: 0.25
notes: Five primer pairs covering seven genes, because the sdr pair amplifies the tandemly arrayed sdrC, sdrD and sdrE together. The paper designed the primers on six S. aureus genomes and read the products as a band pattern on an agarose gel; a sixth locus, coa, was tried and withdrawn because its repeat number varies much more slowly than the others and showed little variation among unrelated strains, so it is not part of this panel and is not bundled. THIS SCHEME SIZES ITS MARKERS BUT DOES NOT CALL THEM. The paper publishes no amplicon sizes, no repeat numbers, no reference values and no allele definitions of any kind: its only tables are the primers and a list of isolates against an MLVA pattern number. Those pattern numbers, 1 to 26 in Table 1, are arbitrary labels for distinct band patterns on a gel rather than per locus alleles, so a profile from this scheme could not be compared with them even if the loci could be called. Amplifying the panel in eight S. aureus genomes fixes each flanking length only up to a whole number of repeats, so it does not supply the missing count either, and no copy number is recorded rather than a doubtful one. THE UNIT LENGTHS WERE CHECKED AGAINST THOSE EIGHT GENOMES and three of the five are corrected. Since a flanking length does not change between strains, every product of a locus must leave the same remainder when divided by its repeat unit. The Introduction describes the R region of clfA, clfB and the sdr genes as an 18 bp repeat, which is three Ser-Asp dipeptides, but a dipeptide is two codons and the array gains and loses them singly: across the eight genomes every observed step at those three loci is a multiple of 6 and not of 18, and the remainders collapse to one value only at 6 bp, over 7 distinct sizes at clfA, 6 at clfB and 14 at sdr. markers.tsv therefore records 6 bp at all three, and the 18 bp the paper states is kept here. The other two pass at the figures the paper gives, 24 bp for spa and the 9 bp tripeptide unit for sspA. SDR GIVES MORE THAN ONE PRODUCT BY DESIGN and is declared in known_multiple, so the checks that require one product per marker skip it and a call for it is flagged MULTIPLE. Six of the eight genomes give the three products the paper expects; NCTC 8325 and MRSA252 give two, so the reference happens to be one of the two strains where a member of the array is absent or diverged at a primer site, which is worth knowing when reading its band pattern. The sspA primers carry the IUPAC ambiguity codes M and Y, so that marker is not searchable at word size 11 and is found by the rescue pass at word size 6 instead; this is a property of the published primers and not a fault in the scheme. check-scheme against NCTC 8325 reproduces each of the other four loci with exactly one product, clfA 997 bp, clfB 828 bp, spa 308 bp and sspA 155 bp. The spa locus here is the same protein A repeat region that spa sequence typing reads and that saureus_mlva8_schouls_2009 amplifies as VNTR24_01 with different primers, so the two S. aureus schemes are not independent at that locus and their spa products are not the same fragment. The search windows are derived rather than published and every size seen across the eight genomes falls inside its window. rounding and allele_tolerance are recorded for a future definition file and have no effect while no marker can be called.
