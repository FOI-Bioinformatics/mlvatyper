# Staphylococcus aureus, the five locus MLVA of Sabat et al. 2003, read as a band pattern on a gel.
name: saureus_mlva5_sabat_2003
organism: Staphylococcus aureus
citation: Sabat A, Krzyszton-Russjan J, Strzalka W, Filipek R, Kosowska K, Hryniewicz W, Travis J, Potempa J. New method for typing Staphylococcus aureus strains: multiple-locus variable-number tandem repeat analysis of polymorphism and genetic relationships of clinical isolates. J Clin Microbiol 2003;41:1801-1804. doi:10.1128/JCM.41.4.1801-1804.2003, Table 2 (primers) and the Introduction (the repeat unit of each gene family)
url: https://doi.org/10.1128/JCM.41.4.1801-1804.2003 (Table 2; the paper has no table of sizes or repeat numbers)
reference: Staphylococcus aureus subsp. aureus NCTC 8325, chromosome CP000253.1, the control strain the paper types as isolate 34; ref_size is the product these primers give in that assembly and is not a published value
assembly: GCA_000013425.1
retrieved: 2026-11-03
known_multiple: sdr
rounding: intermediate
allele_tolerance: 0.25
notes: Five primer pairs covering seven genes, because the sdr pair amplifies the tandemly arrayed sdrC, sdrD and sdrE together. The paper designed the primers on six S. aureus genomes and read the products as a band pattern on an agarose gel; a sixth locus, coa, was tried and withdrawn because its repeat number varies much more slowly than the others and showed little variation among unrelated strains, so it is not part of this panel and is not bundled. THIS SCHEME SIZES ITS MARKERS BUT DOES NOT CALL THEM. The paper publishes no amplicon sizes, no repeat numbers, no reference values and no allele definitions of any kind: its only tables are the primers and a list of isolates against an MLVA pattern number. Those pattern numbers, 1 to 26 in Table 1, are arbitrary labels for distinct band patterns on a gel rather than per locus alleles, so a profile from this scheme could not be compared with them even if the loci could be called. The repeat unit lengths recorded in markers.tsv come from the Introduction, which describes an 18 bp repeat encoding Ser-Asp dipeptides in the R region of clfA, clfB and the sdr genes, a 9 bp tripeptide repeat in sspA and a 24 bp repeat in spa; the paper tabulates none of them. SDR GIVES MORE THAN ONE PRODUCT BY DESIGN and is declared in known_multiple, so the checks that require one product per marker skip it and a call for it is flagged MULTIPLE; in NCTC 8325 it gives two products, 640 bp and 796 bp, from adjacent positions in the sdr array, where the paper expects three genes. The sspA primers carry the IUPAC ambiguity codes M and Y, so that marker is not searchable at word size 11 and is found by the rescue pass at word size 6 instead; this is a property of the published primers and not a fault in the scheme. check-scheme against NCTC 8325 reproduces each of the other four loci with exactly one product, clfA 997 bp, clfB 828 bp, spa 308 bp and sspA 155 bp. The spa locus here is the same protein A repeat region that spa sequence typing reads and that saureus_mlva8_schouls_2009 amplifies as VNTR24_01 with different primers, so the two S. aureus schemes are not independent at that locus and their spa products are not the same fragment. rounding and allele_tolerance are recorded for a future definition file and have no effect while no marker can be called.
