# Staphylococcus aureus, the five locus MLVA of Sabat et al. 2003, read as a band pattern on a gel.
name: saureus_mlva5_sabat_2003
organism: Staphylococcus aureus
citation: Sabat A, Krzyszton-Russjan J, Strzalka W, Filipek R, Kosowska K, Hryniewicz W, Travis J, Potempa J. New method for typing Staphylococcus aureus strains: multiple-locus variable-number tandem repeat analysis of polymorphism and genetic relationships of clinical isolates. J Clin Microbiol 2003;41:1801-1804. doi:10.1128/JCM.41.4.1801-1804.2003, Table 2 (primers) and the Introduction (the repeat unit of each gene family)
url: https://doi.org/10.1128/JCM.41.4.1801-1804.2003 (Table 2; the paper has no table of sizes or repeat numbers)
reference: Staphylococcus aureus subsp. aureus NCTC 8325, chromosome CP000253.1, the control strain the paper types as isolate 34; ref_size is the product these primers give in that assembly and is not a published value
assembly: GCA_000013425.1
retrieved: 2026-11-03
known_multiple: sdr
rounding: intermediate
allele_tolerance: 0.25
notes: Five primer pairs covering seven genes, because the sdr pair amplifies the tandemly arrayed sdrC, sdrD and sdrE together. The paper designed the primers on six S. aureus genomes and read the products as a band pattern on an agarose gel; a sixth locus, coa, was tried and withdrawn because its repeat number varies much more slowly than the others, so it is not part of this panel and is not bundled. THE REPEAT COUNT HERE IS A CONVENTION OF THIS SCHEME, NOT A PUBLISHED VALUE. Sabat et al. 2003 numbers band patterns and publishes no repeat counts, so there is no published scale to match, and the primers lie inside the repeat arrays, so there is no flanking landmark to anchor a count on: across eight genomes the conserved ends of each product are about the length of the primers themselves. The scheme therefore defines the allele as the number of whole repeat units that fit between the two primer sites of the product, floor((product length - forward primer - reverse primer) / unit). For the NCTC 8325 reference this gives clfA 159, clfB 130, sdr 125, spa 11 and ssp 12. Every product of a locus leaves the same remainder, so the rule gives an exact integer for every strain: all 54 products across N315, Mu50, MW2, COL, MRSA252, MSSA476, NCTC 8325 and USA300 agree with the repeat formula, none is negative and the residual is zero. WHAT THE ALLELE IS NOT: it is not a count of the units in the gene, since the primer sites sit inside the array and their own repeat content is left out; it is not Sabat's MLVA type, which is a band pattern number from the paper's isolate collection and is not reproduced; and it is not on the scale of any other scheme. Alleles from this scheme compare only with each other. The unit lengths were checked against the eight genomes, where a locus keeps one flank so every product must leave the same remainder when divided by the unit. The Introduction describes the R region of clfA, clfB and the sdr genes as an 18 bp repeat, which is three Ser-Asp dipeptides, but the array gains and loses one dipeptide at a time, so every observed step is a multiple of 6 and not of 18, and markers.tsv records 6 bp at all three. spa passes at 24 bp and sspA at 9 bp. SDR GIVES MORE THAN ONE PRODUCT BY DESIGN and is declared in known_multiple, so the checks that require one product per marker skip it and each product is flagged MULTIPLE. Six of the eight genomes give three products and NCTC 8325 and MRSA252 give two, so the reference is one of the strains missing a member of the array. Its reference size is the larger of the two NCTC 8325 products, 796 bp. The products of the three genes share one remainder, so their alleles are comparable, but an allele cannot be assigned to its gene from the size; the set of alleles of a strain is its sdr band pattern. The sspA primers carry the IUPAC ambiguity codes M and Y, so that marker is not searchable at word size 11 and is found by the rescue pass at word size 6, which a default run performs; this is a property of the published primers. check-scheme against NCTC 8325 reproduces every reference size, clfA 997 bp, clfB 828 bp, spa 308 bp, sspA 155 bp and the 796 bp sdr product. The spa locus is the protein A repeat region that spa sequence typing reads and that saureus_mlva8_schouls_2009 amplifies as VNTR24_01 and saureus_mlva14_pourcel_2009 as Sa0122, with different primers and on different scales, so the three schemes are not independent there and their spa counts do not compare. The search windows are derived rather than published and every size seen across the eight genomes falls inside its window. rounding and allele_tolerance are not from the paper and should be tuned on control strains.
