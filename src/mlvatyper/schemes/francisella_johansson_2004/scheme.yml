name: francisella_johansson_2004
organism: Francisella tularensis
citation: Johansson A, Farlow J, Larsson P, Dukerich M, Chambers E, Bystrom M, Fox J, Chu M, Forsman M, Sjostedt A, Keim P. Worldwide genetic relationships among Francisella tularensis isolates determined by multiple-locus variable-number tandem repeat analysis. J Bacteriol 2004;186:5808-5818. doi:10.1128/JB.186.17.5808-5818.2004
url: https://doi.org/10.1128/JB.186.17.5808-5818.2004 (marker, genomic location and primer table)
reference: strain SCHU S4, chromosome AJ749949.2 - confirmed by downloading the assembly, which is F. tularensis subsp. tularensis SCHU S4
assembly: GCA_000008985.1
retrieved: 2026-10-24
rounding: nearest
allele_tolerance: 0.25
# markers duplicated in the reference assembly; the reason is in notes
known_multiple: Ft-M14
notes: ref_size is the product length measured in the SCHU S4 assembly GCA_000008985.1 by in silico PCR with these primers. It reproduces the span decoded from the publication's Genomic location column for 24 of the 25 markers, which confirms that the decoding is right and that the column is the amplicon, outer primer edge to outer primer edge, not the repeat array; the earlier doubt about that reading is settled. The end coordinate in that column is printed abbreviated and reuses the start's leading digits (1886647-7109 means 1886647-1887109). The decoding rule was checked against all 25 rows of the table. The published start coordinates are offset from AJ749949.2 by 16 to 60 bases while the spans match, so the table's coordinates come from a different release of the sequence than this assembly. Ft-M10 is the one span that disagrees: the cell reads 1283441-4086 and decodes correctly to 646 bp, but the assembly yields only one possible product of 617 bp, since the forward primer occurs once and no other reverse site lies in range; the 29 base difference is not a multiple of the 16 bp unit, so it is either a real difference between this assembly and the sequence used in 2004 or a mis-stated end coordinate in the source, and the measured 617 is used because ref_size must describe the assembly the calls are anchored on. Two primers are published with 5' bases that are not in the genome, and those bases are trimmed here so that the in silico product equals the published genomic span: a single G on the Ft-M22 forward primer, which otherwise gives 242 bp against a published 241, and an 8 base addition GGGTACCC on the Ft-M25 reverse primer, which otherwise prevents any product. The trimmed bases are part of the published oligonucleotides, so a real reaction yields products 1 and 8 bases longer than the ref_size recorded for those two markers; this does not affect allele numbers, which are differences from the same reference. All 50 primer sequences were compared with the table and match it apart from those two trims, and footnote b marks the shared reverse primer on Ft-M7 to Ft-M10 but not on Ft-M5, which carries the same sequence. Ft-M4 and Ft-M19 still differ from the genome at one and two bases near the 5' end; their products are exactly the decoded size so the loci are right, but the differences consume the mismatch budget and look like transcription slips rather than tails. unit_length, ref_repeats and the repeat motif are the published values of Table 2 of Johansson et al. 2004, which gives the motif, its size in nucleotides and the SCHU S4 copy number for all 25 markers, so every locus is callable on the published scale. An earlier version derived the counts from the reference and left 9 loci empty, warning that a derived count could be offset from the canonical allele; the published table confirms every unit length and corrects eight derived counts (Ft-M2, Ft-M3, Ft-M6, Ft-M14, Ft-M15, Ft-M16, Ft-M17 and Ft-M18), because the arrays are imperfect and an exact motif count misses copies the paper includes. A run on SCHU S4 now returns the published profile with a residual of zero at every locus, and the per-marker motifs and which loci keep a stored pattern are recorded in markers.tsv. Ft-M5, Ft-M7, Ft-M8, Ft-M9 and Ft-M10 share the reverse primer CAGCTCGAACTCCGTCATAC and also share one 16 bp repeat unit at five unrelated positions, so they sample one repeat family rather than five independent loci; that oligo occurs 50 times in SCHU S4, and 59 times in LVS, inside a conserved element of at least 220 bp present in about 48 copies, so each product is selected by size alone and an isolate whose nearby element copy has moved may give a wrong product. Ft-M14 is listed in the publication's table at two locations, 1390169-1390610 and 1783513-1783954, both 442 bp, so the duplication is published rather than a primer fault; the two products are found in the assembly at 1390118-1390559 and 1783453-1783894, the same two lengths, and cannot be separated by product size; it is declared in known_multiple and kept because dropping a published locus would make profiles incomparable with published 25 locus data, but its calls are ambiguous and mlvatyper flags them MULTIPLE. Locus ids are the published unpadded names Ft-M1 to Ft-M25; the later Vogler redesign zero-pads them (Ft-M02) and uses different second-generation primers, so Vogler and Johansson product sizes are not interchangeable and only unit lengths, consensus repeats and copy numbers transfer between the two schemes. Johansson Ft-M20 is one 255 bp amplicon, whereas the Vogler panel splits that locus into separately amplified Ft-M20A and Ft-M20B. Bibliographic details beyond the DOI were not re-verified in this session. rounding and allele_tolerance are not from the paper and should be tuned on control strains. The derived unit lengths were checked across seven Francisella genomes, where every product of a locus must differ by whole multiples of its repeat unit: 15 of the 16 filled units pass, and Ft-M8 does not, its steps of 15 and 33 bases not being multiples of 16, because in WY96-3418 its primers amplify a different member of the shared repeat family about 1.85 Mb away. An Ft-M8 allele from a strain other than the reference should be read with that in mind; a fractional result there is flagged INTERMEDIATE rather than silently rounded. The same comparison matches this panel to francisella_vogler_2008, whose locus names are the padded spelling of these, Ft-M02 against Ft-M2, the two schemes agreeing on the unit at Ft-M2, Ft-M3, Ft-M4, Ft-M5, Ft-M6, Ft-M10 and Ft-M20 while using different primers and different references, so their alleles are not interchangeable.
