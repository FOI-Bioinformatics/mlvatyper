# Staphylococcus aureus, the 14 locus MLVA of Pourcel et al. 2009, run as two multiplex panels.
name: saureus_mlva14_pourcel_2009
organism: Staphylococcus aureus
citation: Pourcel C, Hormigos K, Onteniente L, Sakwinska O, Deurenberg RH, Vergnaud G. Improved multiple-locus variable-number tandem-repeat assay for Staphylococcus aureus genotyping, providing a highly informative technique together with strong phylogenetic value. J Clin Microbiol 2009;47:3121-3128. doi:10.1128/JCM.00267-09, Table 1 (primers, repeat unit lengths and the repeat number in reference strain Mu50); the Mu50 amplicon sizes and a 31 isolate validation set are from Bogut A, Grzegorczyk A, Kuszneruk D. The multiple-locus variable number tandem repeat analysis (MLVA) of Staphylococcus aureus clinical isolates recovered from the Provincial Specialist Hospital in Lublin, Poland. Curr Issues Pharm Med Sci 2024;37:85-91. doi:10.2478/cipms-2024-0014, Tables 2 and 3
url: https://doi.org/10.1128/JCM.00267-09 (Pourcel et al. 2009, Table 1); https://doi.org/10.2478/cipms-2024-0014 (Bogut et al. 2024, Tables 2 and 3)
reference: Staphylococcus aureus subsp. aureus Mu50, that is ATCC 700699, chromosome BA000017.4; ref_size is the product these primers give in that assembly and equals the Mu50 amplicon size Bogut et al. Table 2 report, and ref_repeats is the Mu50 repeat number Pourcel et al. Table 1 gives
assembly: GCA_000009665.1
retrieved: 2026-11-03
rounding: intermediate
allele_tolerance: 0.25
notes: Fourteen loci in two multiplex panels, a first-step panel of ten and a second-step panel of four, kept in that order so a profile string is the published one. EVERY REFERENCE VALUE IS PUBLISHED. Pourcel et al. Table 1 gives the repeat unit length and the copy number in Mu50 for all 14 loci, and Bogut et al. Table 2 gives the Mu50 amplicon size; the primers reproduce every one of those amplicon sizes in the Mu50 assembly, and a run on Mu50 returns the published profile 10-6-3-4-6-7-4-5-3-3-3-5-4-2 with a residual of zero at every locus. The scheme is also checked against the 31 clinical profiles of Bogut et al. Table 3: of 66 panel 1 cells 57 reproduce the published allele exactly, and the nine that differ do so by less than one repeat, which is expected because that study sized its amplicons on agarose gels while this scheme measures them exactly in an assembly. No repeat unit sequences are published, so alleles are called from amplicon length and the tandem count is not a cross-check. coa, locus Sa0266, carries a half-repeat polymorphism, so some strains give an n.5 allele there, as Bogut Table 3 shows; those are real alleles of that locus. Several loci belong to families of short intergenic repeats: Sa0311, Sa1729, Sa1866, Sa0906 and Sa1213 are STAR elements and Sa0122, Sa1291 and Sa1756 carry SIRU numbers. Two primers carry an IUPAC ambiguity code as published, an R in the Sa1729 forward and the Sa1425 reverse primer. The dye label the assay puts on one sense primer of each pair is not part of the oligonucleotide and is not recorded. Sa0122 is the spa protein A repeat region, so this panel is not independent of spa typing. It overlaps the two other bundled S. aureus schemes: Sa0122 and Sa1132 are the same physical arrays that saureus_mlva8_schouls_2009 reads as VNTR24_01 and VNTR63_01, which were anchored to this panel's Mu50 counts, and the spa region is also in saureus_mlva5_sabat_2003; the three schemes use different primers, so their product sizes are not comparable. rounding and allele_tolerance are not from the paper and should be tuned on control strains.
