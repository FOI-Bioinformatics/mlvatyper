name: burkholderia_uren_2007
organism: Burkholderia pseudomallei
citation: U'Ren JM, Schupp JM, Pearson T, et al. Tandem repeat regions within the Burkholderia pseudomallei genome and their application for high resolution genotyping. BMC Microbiol 2007;7:23. doi:10.1186/1471-2180-7-23
url: https://doi.org/10.1186/1471-2180-7-23 (VNTR locus characteristics table and multiplex primer/dye table)
reference: strain K96243, large chromosome BX571965.1 and small chromosome BX571966.1
assembly: GCA_000011545.1
retrieved: 2026-10-24
rounding: nearest
allele_tolerance: 0.25
notes: ref_size and ref_repeats were measured in the K96243 assembly GCA_000011545.1 by in silico PCR with these primers, because the publication gives the array size and an across-isolate amplicon range but not the K96243 product length; ref_size is the product length and ref_repeats the tandem array count in that product. The copy numbers in the publication's locus characteristics table differ for 20 of the 32 markers and are always higher, which suggests a column other than the K96243 copy number was read; they are listed in the comments of markers.tsv for review and are not used. TRF agrees with the counts now in use for 28 of 32 markers. check-scheme reproduces one product of ref_size and the ref_repeats count for all 32 markers. primers.sts expected size holds the published across-isolate amplicon range, not the reference product, which is the search window only. Locus ids are the published names with the space removed (933 k -> 933k); the published form is kept in label. Letter suffixes on primer-table rows (a, b, c) and on two array sizes (2115k 15d, 3564k 30d) are footnote markers in the source and are dropped. patterns are the published consensus repeats with IUPAC expanded to explicit variants: 857k CGAAYGAGC -> CGAACGAGC;CGAATGAGC, 1367k CGCRTCGAA -> CGCATCGAA;CGCGTCGAA. All 32 patterns matched the K96243 amplicons on the strand as published, so none needed reverse complementing. 3564k is a higher-order repeat: TRF reports a 75 bp period, five times the published 15 bp unit, so the 15 bp unit counts only 2 copies and this locus is sized by amplicon length rather than by its array. 2050k is a compound locus of two adjacent 9 bp arrays with different consensus units (CGATGCGGT and GCACCCAAC); both are listed as patterns and ref_repeats is the longest single run, so one allele call reports the combined region and cannot resolve the two arrays separately. 2666k, 3564k, 1367k, 2815k and 2050k lie within CDS per the source. rounding and allele_tolerance are not from the paper; they are starting values chosen because several arrays are imperfect, and should be tuned on control strains. No bins.tsv: the paper publishes allele counts and size ranges but no size-to-allele table, so this scheme is formula-numbered. Allele numbers are therefore anchored on K96243 as measured here and are not guaranteed to match the allele names used in the publication; compare with control strains before using published profiles.
