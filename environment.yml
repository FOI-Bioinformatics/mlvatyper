name: mlvatyper
channels:
  - conda-forge
  - bioconda
dependencies:
  - python>=3.13
  - biopython
  - pandas
  - numpy
  - pytest
  - pytest-cov
  - pip
  # optional aligners; either one is picked up automatically when on PATH
  - mafft
  # - muscle
  # optional repeat finder for 'mlvatyper discover'
  - trf
  - pip:
      - git+https://github.com/FOI-Bioinformatics/merpcr@v1.0.5
      - -e .
