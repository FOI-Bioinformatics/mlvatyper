name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - uses: actions/checkout@v5
      - uses: conda-incubator/setup-miniconda@v4
        with:
          miniforge-version: latest
          environment-file: environment.yml
          activate-environment: mlvatyper
      - name: Cache the reference assemblies named by the bundled schemes
        uses: actions/cache@v4
        with:
          path: ~/.cache/mlvatyper/assemblies
          key: assemblies-${{ hashFiles('src/mlvatyper/schemes/*/scheme.yml') }}
      - name: Lint
        run: |
          pip install ruff
          ruff check src tests
      - name: Test
        env:
          MLVATYPER_ONLINE: "1"
        run: pytest -q --cov=mlvatyper --cov-report=term

  example:
    # Every bundled scheme is checked against the reference assembly named by
    # its GCA_ or GCF_ accession, downloaded from NCBI and cached, and the
    # testM scheme is run end to end on the committed slices, so that a change
    # in the search or calling code shows up as a changed allele, size or
    # repeat count before it reaches a release. No assembly is kept in git.
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - uses: actions/checkout@v5
      - uses: conda-incubator/setup-miniconda@v4
        with:
          miniforge-version: latest
          environment-file: environment.yml
          activate-environment: mlvatyper
      - name: Cache the reference assemblies named by the bundled schemes
        uses: actions/cache@v4
        with:
          path: ~/.cache/mlvatyper/assemblies
          key: assemblies-${{ hashFiles('src/mlvatyper/schemes/*/scheme.yml') }}
      - name: Check the bundled schemes against their reference assemblies
        run: |
          mlvatyper schemes
          for scheme in $(mlvatyper schemes | cut -f1); do
            mlvatyper check-scheme --scheme "$scheme" --outdir "example_out/check_$scheme"
          done
      - name: Every marker of a scheme with an assembly must give one product of the reference size
        run: |
          python - <<'PY'
          import sys
          from pathlib import Path

          import pandas as pd

          from mlvatyper.scheme import list_schemes

          bad = []
          for scheme in list_schemes():
              table = pd.read_csv(Path("example_out") / f"check_{scheme.name}" / "scheme_check.tsv", sep="\t",
                                  keep_default_na=False)
              if scheme.assembly is None:
                  print(f"{scheme.name}: no assembly, files checked only")
                  continue
              products = pd.to_numeric(table["n_products"], errors="coerce")
              size_ok = pd.to_numeric(table["size_ok"], errors="coerce")
              wrong = table[(products != 1) | (size_ok == 0)]
              print(f"{scheme.name}: {len(table)} markers, {int((products == 1).sum())} with one product, "
                    f"{int((size_ok == 1).sum())} with the reference size")
              if len(wrong):
                  bad.append(f"{scheme.name}: {', '.join(wrong['marker'])}")
          if bad:
              sys.exit("markers that do not reproduce the reference: " + "; ".join(bad))
          PY
      - name: Run the testM example end to end
        run: |
          mlvatyper run --scheme testM --fasta tests/data/mini.fasta \
            --outdir example_out --prefix testM --reference-sample mini \
            --rescue-indels --mlvabank --align none
          mlvatyper discover --outdir example_out --sample mini
          mlvatyper report --outdir example_out --prefix testM
      - name: Check the outputs
        run: |
          python - <<'PY'
          import sys
          from pathlib import Path

          import pandas as pd

          out = Path("example_out")
          expected = ["testM_report.html", "testM_alleles.tsv", "testM_status.tsv", "testM_mlvabank.csv",
                      "missing_markers.tsv", "discover_report.tsv", "run_info.json"]
          missing = [name for name in expected if not (out / name).exists()]
          if missing:
              sys.exit(f"missing outputs: {missing}")
          alleles = pd.read_csv(out / "testM_alleles.tsv", sep="\t", index_col=0, dtype=str)
          # the six markers that lie inside the committed slices must be typed
          typed = {m: alleles.loc["mini", m] for m in
                   ("testM01", "testM02", "testM03", "testM06", "testM3a", "testM3b")}
          if typed != {"testM01": "5", "testM02": "3", "testM03": "11", "testM06": "4",
                       "testM3a": "11", "testM3b": "11"}:
              sys.exit(f"unexpected alleles: {typed}")
          report = (out / "testM_report.html").read_text()
          for section in ("Summary", "Allele profiles", "Evidence per amplicon", "Methods"):
              if section not in report:
                  sys.exit(f"report has no {section} section")
          print(f"report {len(report) // 1024} kB, {len(alleles.columns)} markers")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: testM-example
          path: |
            example_out/*.tsv
            example_out/*.csv
            example_out/*.html
            example_out/run_info.json
          retention-days: 14
