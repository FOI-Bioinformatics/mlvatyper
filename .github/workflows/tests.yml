name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - uses: actions/checkout@v5
      - uses: conda-incubator/setup-miniconda@v4
        with:
          miniforge-version: latest
          environment-file: environment.yml
          activate-environment: mlvatyper
      - name: Lint
        run: |
          pip install ruff
          ruff check src tests
      - name: Test
        run: pytest -q --cov=mlvatyper --cov-report=term
